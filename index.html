<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GNTK x Kalorify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07070F; --card: #0F0F1A; --card2: #161625; --border: #1E1E32;
            --accent: #AADF3C; --accent-dim: rgba(170, 223, 60, 0.12); --accent-glow: rgba(170, 223, 60, 0.25);
            --text: #EFEFFA; --muted: #52526E; --dim: #8888A8;
            --blue: #60A5FA; --yellow: #FBBF24; --red: #F87171;
        }

        body { background-color: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
        h1, h2, h3 { font-family: 'Syne', sans-serif; font-weight: 800; letter-spacing: -0.02em; }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 20px; transition: all 0.2s; }
        .card:active { transform: scale(0.98); }

        .btn { background: var(--accent); color: #000; border-radius: 18px; font-weight: 800; padding: 16px 20px; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 12px var(--accent-glow); transition: all 0.15s; }
        .btn:active { transform: scale(0.96); }
        .btn-ghost { background: var(--card2); color: var(--text); border: 1px solid var(--border); box-shadow: none; }

        .inp { background: var(--card2); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; color: var(--text); font-size: 14px; width: 100%; outline: none; }
        .inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }

        /* Navigation */
        #nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 15, 26, 0.85); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around; padding: 12px 0 24px; z-index: 50; }
        .nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 10px; font-weight: 700; transition: color 0.2s; }
        .nav-btn.active { color: var(--accent); }
        #add-fab { width: 60px; height: 60px; border-radius: 22px; background: var(--accent); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 32px var(--accent-glow); margin-top: -30px; border: none; transition: transform 0.1s; }
        #add-fab:active { transform: scale(0.9) rotate(-5deg); }

        /* Workout Specifics */
        .check-pill { width: 44px; height: 44px; border-radius: 14px; background: var(--card2); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .check-pill.done { background: var(--accent); border-color: var(--accent); color: #000; }
        .type-indicator { width: 24px; height: 24px; border-radius: 6px; display: flex; items-center; justify-content: center; font-size: 10px; font-weight: 800; }
        .type-N { background: var(--card2); color: var(--dim); }
        .type-W { background: var(--yellow); color: #000; }
        .type-D { background: var(--blue); color: #000; }
        .type-F { background: var(--red); color: #000; }

        /* Modal / Bottom Sheet */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: flex-end; transition: opacity 0.3s; }
        .modal-box { background: var(--card); border-radius: 32px 32px 0 0; padding: 24px; width: 100%; max-height: 94vh; overflow-y: auto; border-top: 1px solid var(--border); box-shadow: 0 -10px 50px rgba(0,0,0,0.3); }

        /* Progress Dots */
        .cal-day { width: 44px; height: 58px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--card2); border: 1px solid var(--border); font-size: 12px; }
        .cal-active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #000; border-radius: 20px; padding: 12px 24px; font-weight: 800; z-index: 300; display: none; box-shadow: 0 12px 36px rgba(0,0,0,0.4); animation: slideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.2); }
        @keyframes slideIn { from { transform: translate(-50%, -40px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input[type="number"] { -moz-appearance: textfield; }
    </style>
</head>
<body>

    <div id="toast"></div>

    <div id="loader" class="fixed inset-0 z-[400] bg-[#07070F] flex items-center justify-center">
        <div class="text-center">
            <h1 class="text-4xl italic text-white animate-pulse">GNTK.</h1>
            <p class="text-xs font-bold text-gray-600 mt-2 uppercase tracking-[0.3em]">Studio Edition</p>
        </div>
    </div>

    <!-- Auth -->
    <div id="auth-screen" class="fixed inset-0 z-[200] bg-[#07070F] hidden flex flex-col items-center justify-center px-10">
        <div class="text-center mb-12">
            <div class="w-20 h-20 bg-accent-dim rounded-[28px] flex items-center justify-center mx-auto mb-6">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </div>
            <h1 class="text-5xl text-white">GNTK.</h1>
            <p class="text-gray-500 font-medium mt-2">Personal Gym Analytics</p>
        </div>
        <div class="w-full max-w-sm space-y-4">
            <input type="email" id="auth-email" placeholder="E-Mail" class="inp">
            <input type="password" id="auth-password" placeholder="Passwort" class="inp">
            <button onclick="handleSignIn()" class="btn w-full">Anmelden</button>
            <button onclick="handleSignUp()" class="w-full text-gray-500 font-bold text-sm">Account erstellen</button>
        </div>
    </div>

    <!-- App Header -->
    <header id="main-header" class="px-6 pt-12 pb-6 flex justify-between items-center">
        <div>
            <p class="text-[10px] font-black text-accent uppercase tracking-widest mb-1" id="date-label">READY TO WORK</p>
            <h1 id="view-title" class="text-3xl text-white">Dashboard</h1>
        </div>
        <div id="p-avatar" onclick="showTab('profile')" class="w-12 h-12 bg-card2 border border-border rounded-2xl flex items-center justify-center font-black text-sm text-accent cursor-pointer shadow-xl">?</div>
    </header>

    <main id="view-container" class="px-6 pb-20">
        <!-- HOME -->
        <div id="view-home" class="space-y-8">
            <section class="flex space-x-2 overflow-x-auto no-scrollbar py-2" id="mini-calendar"></section>

            <div class="card bg-accent text-black border-none relative overflow-hidden" onclick="showTab('coach')">
                <p class="text-[9px] font-black uppercase tracking-widest opacity-60 mb-1">AI Analyst</p>
                <p id="daily-insight" class="text-xl font-bold leading-tight">Analysiere Fortschritt...</p>
                <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-white/20 blur-2xl rounded-full"></div>
            </div>

            <section class="space-y-4">
                <h2 class="text-[12px] font-black text-muted uppercase tracking-widest">Deine Routinen</h2>
                <div id="routines-list" class="grid grid-cols-1 gap-3"></div>
            </section>

            <section class="space-y-4">
                <h2 class="text-[12px] font-black text-muted uppercase tracking-widest">Letzte Trainings</h2>
                <div id="history-list" class="space-y-3"></div>
            </section>
        </div>

        <!-- STATS -->
        <div id="view-stats" class="hidden space-y-8">
            <div class="card">
                <p class="text-center text-[10px] font-black text-muted uppercase tracking-widest mb-4">Muskel-Balance</p>
                <div class="h-56 flex justify-center"><canvas id="muscleChart"></canvas></div>
            </div>
            <div class="card space-y-4">
                <div class="flex justify-between items-center"><p class="text-[10px] font-black text-muted uppercase tracking-widest">Gewicht (kg)</p><button onclick="logWeight()" class="text-accent text-xs font-bold">+ Log</button></div>
                <div class="h-44"><canvas id="weightChart"></canvas></div>
            </div>
        </div>

        <!-- COACH -->
        <div id="view-coach" class="hidden flex flex-col">
            <div id="chat-box" class="flex-1 space-y-4 overflow-y-auto no-scrollbar flex flex-col pb-6" style="height: 55vh;"></div>
            <div class="flex space-x-2 bg-card2 p-2 rounded-[24px] border border-border shadow-xl">
                <input type="text" id="chat-input" placeholder="Frag den Coach..." class="flex-1 px-4 py-3 bg-transparent outline-none font-medium text-white">
                <button onclick="askCoach()" class="btn p-3 rounded-2xl"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg></button>
            </div>
        </div>

        <!-- PROFILE -->
        <div id="view-profile" class="hidden space-y-8">
            <div class="card flex items-center space-x-5">
                <div class="w-16 h-16 bg-accent rounded-[20px] flex items-center justify-center text-black text-2xl font-black" id="p-initials">?</div>
                <div>
                    <input type="text" id="p-name" onchange="saveProfile()" placeholder="Name" class="text-2xl font-bold bg-transparent text-white outline-none w-full">
                    <p class="text-muted text-sm" id="p-email"></p>
                </div>
            </div>
            <div class="card space-y-4">
                <p class="text-[10px] font-black text-muted uppercase tracking-widest">Gemini API Key</p>
                <input type="password" id="p-api-key" onchange="saveProfile()" placeholder="AIzaSy..." class="inp font-mono text-xs">
            </div>
            <div class="space-y-4"><h2 class="text-[12px] font-black text-muted uppercase tracking-widest">Bestleistungen</h2><div id="pr-wall" class="space-y-3"></div></div>
            <button onclick="handleSignOut()" class="btn btn-ghost w-full py-5 text-red-500 font-bold border-red-500/20">Abmelden</button>
        </div>
    </main>

    <!-- Workout Screen -->
    <div id="workout-overlay" class="modal-overlay hidden">
        <div class="modal-box !rounded-none !h-full flex flex-col p-0 bg-[#07070F]">
            <header class="p-6 flex justify-between items-end border-b border-border bg-card">
                <div><h2 id="wo-title" class="text-2xl font-black text-white">Workout</h2><p id="wo-timer" class="text-accent font-black tabular-nums">00:00</p></div>
                <button onclick="finishWorkout()" class="btn px-8 py-3 shadow-none">BEENDEN</button>
            </header>
            <div id="wo-container" class="flex-1 overflow-y-auto p-6 space-y-8 no-scrollbar"></div>
            <div class="p-6 bg-card border-t border-border"><button onclick="showPicker(false)" class="btn btn-ghost w-full py-4 text-xs font-black uppercase tracking-widest">+ Übung hinzufügen</button></div>
        </div>
    </div>

    <!-- Navigation -->
    <nav id="nav">
        <button onclick="showTab('home')" id="nav-home" class="nav-item nav-btn active">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
            HEUTE
        </button>
        <button onclick="showTab('stats')" id="nav-stats" class="nav-item nav-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
            STATS
        </button>
        <button id="add-fab" onclick="startWorkout(null)">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button onclick="showTab('coach')" id="nav-coach" class="nav-item nav-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            COACH
        </button>
        <button onclick="showTab('profile')" id="nav-profile" class="nav-item nav-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            PROFIL
        </button>
    </nav>

    <!-- Modals (Picker, Detail, Plate) -->
    <div id="picker-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <header class="flex justify-between items-center mb-6">
                <h2 class="text-2xl text-white">Wähle Übung</h2>
                <button onclick="closePicker()" class="text-muted text-3xl">&times;</button>
            </header>
            <input type="text" id="p-search" placeholder="Suche..." class="inp mb-4">
            <div id="p-filters" class="flex space-x-2 overflow-x-auto no-scrollbar mb-6"></div>
            <div id="p-list" class="space-y-2 pb-10"></div>
        </div>
    </div>

    <div id="plate-modal" class="fixed inset-0 z-[300] hidden flex items-center justify-center p-8">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-md" onclick="this.parentElement.classList.add('hidden')"></div>
        <div class="card bg-card border-border w-full max-w-xs text-center p-10 space-y-6">
            <h3 id="plate-val" class="text-4xl font-black text-accent">80 kg</h3>
            <div id="plate-graphic" class="flex items-center justify-center min-h-[40px] space-x-1"></div>
            <p class="text-[10px] text-muted font-bold uppercase tracking-widest">Pro Seite (20kg Stange)</p>
        </div>
    </div>

    <script>
        const { createClient } = supabase;
        const db = createClient('https://zefzrvnqpqmypzskrskl.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplZnpydm5xcHFteXB6c2tyc2tsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MTkyMDcsImV4cCI6MjA5NTk5NTIwN30.k-4lVCN_vCHUS212fBZq1Wr4lhnDVth1mednj20_HXA');
        
        let user = null, activeW = null, timerInt = null, hData = [], rData = [], pBests = {}, sMuscle = null, userApiKey = null;
        let charts = { muscle: null, weight: null };

        function pulse() { if(navigator.vibrate) navigator.vibrate(12); }
        function showToast(m) { const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none', 2500); }

        async function checkAuth() {
            const { data } = await db.auth.getSession();
            if (data.session) { user = data.session.user; initApp(); }
            else { document.getElementById('auth-screen').classList.remove('hidden'); document.getElementById('loader').classList.add('hidden'); }
        }
        db.auth.onAuthStateChange((_, s) => { if (s) { user = s.user; initApp(); } else { window.location.reload(); } });

        async function initApp() {
            userApiKey = user.user_metadata?.gemini_key;
            document.getElementById('p-name').value = user.user_metadata?.full_name || "";
            document.getElementById('p-api-key').value = userApiKey || "";
            document.getElementById('p-email').textContent = user.email;
            document.getElementById('p-initials').textContent = (user.user_metadata?.full_name || user.email).charAt(0).toUpperCase();
            await loadAll();
            document.getElementById('loader').classList.add('hidden');
            getCoachInsight();
        }

        async function loadAll() {
            const { data: h } = await db.from('workouts').select('*, sets(*, exercises(*))').eq('user_id', user.id).order('start_time', { ascending: false });
            hData = h || [];
            const { data: r } = await db.from('routines').select('*, routine_exercises(exercises(*))').eq('user_id', user.id);
            rData = r || [];
            refreshPRs(); renderHome(); renderCalendar();
        }

        function renderHome() {
            document.getElementById('routines-list').innerHTML = rData.map((r, i) => `
                <div class="card p-6 flex justify-between items-center bg-card2 border-none" onclick="startWorkout(${i})">
                    <div><h3 class="text-xl text-white italic mb-1">${r.name}</h3><p class="text-[10px] font-black text-accent uppercase tracking-widest">${r.routine_exercises.length} Übungen</p></div>
                    <div class="bg-accent text-black p-2 rounded-xl shadow-lg"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 3l14 9-14 9V3z"/></svg></div>
                </div>
            `).join('');
            document.getElementById('history-list').innerHTML = hData.slice(0,5).map(w => `
                <div class="card p-5 flex justify-between items-center" onclick="showHistoryDetail('${w.id}')">
                    <div><div class="font-bold text-white">${new Date(w.start_time).toLocaleDateString('de-DE')}</div><p class="text-[10px] text-muted font-bold uppercase tracking-widest">${w.name}</p></div>
                    <div class="text-accent font-black text-[10px] uppercase">DETAILS</div>
                </div>
            `).join('');
        }

        function renderCalendar() {
            const cont = document.getElementById('mini-calendar');
            const dates = hData.map(w => new Date(w.start_time).toLocaleDateString());
            let html = "";
            for(let i=6; i>=0; i--) {
                const d = new Date(); d.setDate(d.getDate()-i);
                const active = dates.includes(d.toLocaleDateString());
                html += `<div class="cal-day ${active?'cal-active':''}"><span class="text-[8px] font-black uppercase mb-1">${d.toLocaleDateString('de-DE',{weekday:'short'})}</span><span class="font-black text-sm">${d.getDate()}</span></div>`;
            }
            cont.innerHTML = html;
        }

        async function startWorkout(rI) {
            pulse();
            activeW = { startTime: new Date(), exercises: [], name: rI!==null?rData[rI].name:'Training' };
            if (rI !== null) {
                for (let re of rData[rI].routine_exercises) {
                    const ex = re.exercises;
                    const lastW = hData.find(w => w.sets.some(s => s.exercise_id === ex.id));
                    let lp = lastW ? lastW.sets.filter(s => s.exercise_id === ex.id).map(s => `${s.weight}x${s.reps}`).join(' | ') : "-";
                    activeW.exercises.push({ ...ex, lastP: lp, sets: [{ weight: lastW?.sets[0]?.weight || '', reps: lastW?.sets[0]?.reps || '', type: 'Normal', done: false }] });
                }
            }
            document.getElementById('wo-title').textContent = activeW.name;
            document.getElementById('workout-overlay').classList.remove('hidden');
            renderWorkoutUI(); startTimer();
        }

        function renderWorkoutUI() {
            document.getElementById('wo-container').innerHTML = activeW.exercises.map((ex, exI) => `
                <div class="card !bg-card2 border-none space-y-5">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center space-x-4">
                            <div class="w-12 h-12 rounded-xl bg-bg flex items-center justify-center overflow-hidden"><img src="${ex.gif_url}" class="w-full h-full object-cover"></div>
                            <div><h3 class="font-bold text-accent text-sm uppercase">${ex.name}</h3><p class="text-[9px] text-muted font-black uppercase tracking-widest">${ex.muscle}</p></div>
                        </div>
                        <button onclick="activeW.exercises.splice(${exI},1); renderWorkoutUI();" class="text-muted">&times;</button>
                    </div>
                    <table class="w-full text-center">
                        <tr class="text-[9px] font-black text-muted uppercase tracking-widest"><td>Typ</td><td>kg</td><td>Wdh</td><td>Ok</td></tr>
                        ${ex.sets.map((s, sI) => `
                            <tr class="${s.done ? 'opacity-20' : ''} transition-all">
                                <td class="py-2"><div onclick="cycleType(${exI},${sI})" class="type-indicator type-${s.type.charAt(0)} mx-auto">${s.type.charAt(0)}</div></td>
                                <td><input type="number" value="${s.weight}" placeholder="0" oninput="activeW.exercises[${exI}].sets[${sI}].weight=this.value" onclick="showPlates(this.value)" class="w-16 py-3 font-black text-xl text-center text-white"></td>
                                <td><input type="number" value="${s.reps}" placeholder="0" oninput="activeW.exercises[${exI}].sets[${sI}].reps=this.value" class="w-16 py-3 font-black text-xl text-center text-white"></td>
                                <td class="text-right"><div onclick="toggleSet(${exI},${sI})" class="check-pill ${s.done ? 'done' : ''} ml-auto"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4"><path d="M20 6L9 17L4 12"/></svg></div></td>
                            </tr>`).join('')}
                    </table>
                    <button onclick="addSet(${exI})" class="w-full py-2.5 bg-bg/50 rounded-xl text-[10px] font-black text-muted uppercase tracking-widest">+ Satz</button>
                </div>
            `).join('');
        }

        function cycleType(exI, sI) { pulse(); const t = ['Normal', 'Warmup', 'Dropset', 'Failure']; const s = activeW.exercises[exI].sets[sI]; s.type = t[(t.indexOf(s.type)+1)%t.length]; renderWorkoutUI(); }
        function addSet(exI) { pulse(); const last = activeW.exercises[exI].sets.slice(-1)[0]; activeW.exercises[exI].sets.push({ ...last, done: false }); renderWorkoutUI(); }
        
        function toggleSet(exI, sI) {
            const s = activeW.exercises[exI].sets[sI]; s.done = !s.done;
            if (s.done) {
                if(navigator.vibrate) navigator.vibrate([15, 30, 15]);
                const val = s.weight * (1 + s.reps/30);
                if (!pBests[activeW.exercises[exI].id] || val > pBests[activeW.exercises[exI].id].val) confetti({ particleCount: 150, spread: 70, origin: { y: 0.8 }, colors: ['#AADF3C', '#FFFFFF'] });
            } else pulse();
            renderWorkoutUI();
        }

        function startTimer() { const el = document.getElementById('wo-timer'); timerInt = setInterval(() => { const d = Math.floor((new Date()-activeW.startTime)/1000); el.textContent = `${Math.floor(d/60).toString().padStart(2,'0')}:${(d%60).toString().padStart(2,'0')}`; }, 1000); }

        async function finishWorkout() {
            if (activeW.exercises.length === 0) return window.location.reload();
            if (!confirm('Session speichern?')) return;
            const { data } = await db.from('workouts').insert([{ user_id: user.id, name: activeW.name }]).select();
            const sets = [];
            activeW.exercises.forEach(ex => ex.sets.forEach((s, i) => { if (s.done) sets.push({ workout_id: data[0].id, exercise_id: ex.id, weight: parseFloat(s.weight)||0, reps: parseInt(s.reps)||0, set_type: s.type, set_order: i }); }));
            if (sets.length > 0) await db.from('sets').insert(sets);
            window.location.reload();
        }

        function showTab(t) {
            pulse();
            ['home','stats','coach','profile'].forEach(id => { document.getElementById('view-' + id).classList.add('hidden'); document.getElementById('nav-' + id).classList.remove('active'); });
            document.getElementById('view-' + t).classList.remove('hidden'); document.getElementById('nav-' + t).classList.add('active');
            document.getElementById('view-title').textContent = {home:'Dashboard', stats:'Statistiken', coach:'AI Coach', profile:'Profil'}[t];
            if(t === 'stats') renderStats();
        }

        function showPlates(kg) {
            const t = parseFloat(kg); if (isNaN(t) || t < 20) return;
            let rem = (t - 20) / 2; const av = [20, 15, 10, 5, 2.5, 1.25]; let h = "";
            av.forEach(p => { while(rem >= p) { h += `<div class="plate plate-${Math.floor(p)}">${p}</div>`; rem -= p; } });
            document.getElementById('plate-val').textContent = kg + " kg";
            document.getElementById('plate-graphic').innerHTML = h || "-";
            document.getElementById('plate-modal').classList.remove('hidden');
        }

        async function getCoachInsight() {
            if(!userApiKey) { document.getElementById('daily-insight').textContent = "Hinterlege dein Key im Profil."; return; }
            callGemini("Gib einen extrem kurzen, motivierenden Fitness-Satz basierend auf " + hData.length + " Workouts.", r => document.getElementById('daily-insight').textContent = r);
        }

        async function askCoach() {
            const inp = document.getElementById('chat-input'); const t = inp.value.trim(); if (!t || !userApiKey) return;
            const b = document.getElementById('chat-box'); b.innerHTML += `<div class="chat-bubble user" style="background:var(--accent);color:#000;align-self:flex-end;padding:12px 16px;border-radius:18px 18px 4px 18px;max-width:85%;font-weight:700">${t}</div>`; inp.value = "";
            const lId = "L"+Date.now(); b.innerHTML += `<div id="${lId}" class="chat-bubble bot animate-pulse" style="background:var(--card2);padding:12px 16px;border-radius:18px 18px 18px 4px;align-self:flex-start;max-width:85%">...</div>`;
            b.scrollTop = b.scrollHeight;
            callGemini(t, r => { document.getElementById(lId).innerHTML = r.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>'); b.scrollTop = b.scrollHeight; });
        }

        async function callGemini(t, cb) {
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${userApiKey}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ parts: [{ text: t }] }] }) });
                const d = await r.json(); cb(d.candidates[0].content.parts[0].text);
            } catch (e) { cb("Fehler am Key."); }
        }

        function refreshPRs() { pBests = {}; hData.forEach(w => w.sets.forEach(s => { const val = s.weight*(1+s.reps/30); if(!pBests[s.exercise_id] || val > pBests[s.exercise_id].val) pBests[s.exercise_id] = { val, weight: s.weight, reps: s.reps, name: s.exercises?.name }; })); renderPRWall(); }
        function renderPRUI() {} // Refactored to PRWall
        function renderPRWall() { document.getElementById('pr-wall').innerHTML = Object.values(pBests).sort((a,b)=>b.val-a.val).slice(0,5).map(pr => `<div class="card p-4 flex justify-between items-center bg-card2 border-none"><div><p class="text-[8px] font-black text-muted uppercase mb-1">${pr.name}</p><h3 class="text-xl text-accent italic">${pr.weight} KG</h3></div><p class="text-white font-black">${pr.reps} REPS</p></div>`).join(''); }

        function renderStats() {
            const c = {}; hData.slice(0,10).forEach(w => w.sets.forEach(s => { const m = s.exercises?.muscle || 'Other'; c[m] = (c[m]||0) + 1; }));
            if (charts.muscle) charts.muscle.destroy();
            charts.muscle = new Chart(document.getElementById('muscleChart'), { type: 'doughnut', data: { labels: Object.keys(c), datasets: [{ data: Object.values(c), backgroundColor: ['#AADF3C', '#60A5FA', '#FBBF24', '#F87171', '#AF52DE'], borderWeight: 0 }] }, options: { cutout: '80%', plugins: { legend: { position: 'bottom', labels: { color: '#8888A8', font: { size: 10, weight: 'bold' } } } } } });
        }

        function closePicker() { document.getElementById('picker-modal').classList.add('hidden'); }
        function showPicker(isR) { document.getElementById('picker-modal').classList.remove('hidden'); runSearch(""); }
        async function runSearch(q) {
            let query = db.from('exercises').select('*'); if (q) query = query.ilike('name', `%${q}%`);
            const { data } = await query.order('name').limit(15);
            document.getElementById('p-list').innerHTML = (data || []).map(ex => `<div class="card p-4 flex items-center space-x-4 bg-card2 border-none" onclick='activeW.exercises.push({ ...${JSON.stringify(ex).replace(/'/g, "&apos;")}, sets: [{ weight: "", reps: "", type: "Normal", done: false }] }); renderWorkoutUI(); closePicker();'><div class="w-12 h-12 rounded-xl bg-bg flex items-center justify-center overflow-hidden"><img src="${ex.gif_url}" class="w-full h-full object-cover"></div><div><h3 class="text-white font-bold">${ex.name}</h3><p class="text-[9px] text-accent font-black uppercase tracking-widest">${ex.muscle}</p></div></div>`).join('');
        }

        async function saveProfile() { await db.auth.updateUser({ data: { full_name: document.getElementById('p-name').value, gemini_key: document.getElementById('p-api-key').value } }); }
        async function handleSignIn() { const { error } = await db.auth.signInWithPassword({ email: document.getElementById('auth-email').value, password: document.getElementById('auth-password').value }); if(error) alert(error.message); }
        async function handleSignUp() { const { error } = await db.auth.signUp({ email: document.getElementById('auth-email').value, password: document.getElementById('auth-password').value }); if(error) alert(error.message); else alert("E-Mail prüfen!"); }
        async function handleSignOut() { await db.auth.signOut(); }

        checkAuth();
    </script>
</body>
</html>
