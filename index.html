<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GNTK - Pro Gym</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --system-blue: #007AFF; --system-bg: #F2F2F7; --card-bg: #FFFFFF; }
        body { background-color: var(--system-bg); color: #1C1C1E; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .card { background: var(--card-bg); border-radius: 20px; border: 1px solid rgba(0,0,0,0.05); }
        .btn-primary { background-color: var(--system-blue); color: white; transition: all 0.2s ease; }
        .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
        .custom-checkbox { width: 28px; height: 28px; border-radius: 10px; border: 2px solid #E5E5EA; appearance: none; cursor: pointer; position: relative; transition: all 0.2s; }
        .custom-checkbox:checked { background-color: #34C759; border-color: #34C759; }
        .custom-checkbox:checked::after { content: '✓'; color: white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: bold; font-size: 16px; }
        .input-field { background-color: #F2F2F7; border-radius: 12px; padding: 12px 16px; width: 100%; border: none; outline: none; }
        .filter-chip { padding: 8px 16px; border-radius: 14px; background: #E5E5EA; font-size: 12px; font-weight: 600; color: #8E8E93; white-space: nowrap; cursor: pointer; transition: all 0.2s; }
        .filter-chip.active { background: var(--system-blue); color: white; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input[type="number"] { -moz-appearance: textfield; background: transparent; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; }
        .gif-container { background: #fdfdfd; mix-blend-mode: multiply; }
    </style>
</head>
<body class="pb-32">

    <!-- Auth Screen -->
    <div id="auth-screen" class="fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center px-10 space-y-8 hidden">
        <div class="text-center">
            <h1 class="text-4xl font-bold tracking-tighter">GNTK</h1>
            <p class="text-gray-400 font-medium mt-1">Dein minimalistischer Gym-Tracker</p>
        </div>
        <div class="w-full max-w-sm space-y-4">
            <input type="email" id="auth-email" placeholder="E-Mail" class="input-field">
            <input type="password" id="auth-password" placeholder="Passwort" class="input-field">
            <button onclick="handleSignIn()" class="btn-primary w-full py-4 rounded-xl font-bold">Login</button>
            <button onclick="handleSignUp()" class="w-full py-4 rounded-xl font-bold text-gray-400">Account erstellen</button>
            <p id="auth-error" class="text-red-500 text-xs text-center hidden"></p>
        </div>
    </div>

    <!-- Header -->
    <header id="main-header" class="px-6 pt-12 pb-6">
        <p class="text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1" id="current-date"></p>
        <h1 id="header-title" class="text-3xl font-bold tracking-tight">Training</h1>
    </header>

    <main id="app" class="px-6">
        <!-- HOME SCREEN -->
        <div id="home-screen" class="space-y-8">
            <button onclick="startNewWorkout()" class="btn-primary w-full py-6 rounded-2xl font-bold text-xl shadow-lg">Neues Training</button>
            <section>
                <h2 class="text-[13px] font-bold text-gray-400 uppercase tracking-wider mb-4 ml-1">Letzte Einheiten</h2>
                <div id="history-list" class="space-y-3"></div>
            </section>
        </div>

        <!-- PROFILE SCREEN -->
        <div id="profile-screen" class="hidden space-y-8">
            <div class="card p-6 flex items-center space-x-4">
                <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center text-blue-600 text-2xl font-bold" id="profile-initials">?</div>
                <div><h2 class="text-xl font-bold" id="profile-name">Athlet</h2><p class="text-gray-400 text-sm" id="profile-email"></p></div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="card p-5 text-center"><p class="text-[10px] font-bold text-gray-400 uppercase mb-1">Trainings</p><p class="text-2xl font-bold" id="stat-count">0</p></div>
                <div class="card p-5 text-center"><p class="text-[10px] font-bold text-gray-400 uppercase mb-1">Volumen</p><p class="text-2xl font-bold" id="stat-volume">0 <span class="text-sm font-normal text-gray-400">kg</span></p></div>
            </div>
            <section class="space-y-4">
                <h2 class="text-[13px] font-bold text-gray-400 uppercase ml-1">Optionen</h2>
                <div class="card overflow-hidden">
                    <button onclick="handleSignOut()" class="w-full p-4 text-left text-red-500 text-sm font-bold bg-red-50/30">Abmelden</button>
                </div>
            </section>
        </div>

        <!-- ACTIVE WORKOUT -->
        <div id="workout-screen" class="hidden space-y-6 pb-20">
            <div class="flex justify-between items-end">
                <div><span id="workout-timer" class="text-2xl font-bold tabular-nums">00:00</span><p class="text-gray-400 text-sm font-medium">Session läuft</p></div>
                <button onclick="finishWorkout()" class="bg-gray-100 px-6 py-2.5 rounded-full font-bold text-sm">Beenden</button>
            </div>
            <div id="active-exercises" class="space-y-6"></div>
            <button onclick="showExercisePicker()" class="w-full py-5 rounded-2xl border-2 border-dashed border-gray-200 text-gray-400 font-bold hover:bg-white transition">+ Übung hinzufügen</button>
        </div>
    </main>

    <!-- Navigation -->
    <nav id="bottom-nav" class="fixed bottom-8 left-6 right-6 h-16 bg-white/90 backdrop-blur-md rounded-2xl border border-white shadow-xl flex justify-around items-center px-4 z-40">
        <button onclick="navigateTo('home')" class="p-3 text-gray-400" id="nav-home-btn"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg></button>
        <button onclick="navigateTo('profile')" class="p-3 text-gray-400" id="nav-profile-btn"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg></button>
    </nav>

    <!-- Picker Modal -->
    <div id="picker-modal" class="fixed inset-0 z-[110] hidden bg-white flex flex-col">
        <header class="p-6 flex justify-between items-center"><h2 class="text-2xl font-bold">Übung wählen</h2><button onclick="hideExercisePicker()" class="text-gray-400 text-4xl">&times;</button></header>
        <div class="px-6 mb-4 space-y-4">
            <input type="text" id="exercise-search" placeholder="Suchen..." class="w-full bg-gray-100 rounded-xl px-5 py-3 outline-none">
            <div class="flex overflow-x-auto space-x-2 no-scrollbar" id="muscle-filters"></div>
            <div class="flex overflow-x-auto space-x-2 no-scrollbar" id="equip-filters"></div>
        </div>
        <div id="picker-list" class="flex-1 overflow-y-auto px-6 space-y-3 pb-20"></div>
    </div>

    <!-- Detail/Animation Modal -->
    <div id="detail-modal" class="fixed inset-0 z-[130] hidden flex items-center justify-center p-6">
        <div class="absolute inset-0 bg-white/95 backdrop-blur-md" onclick="hideDetail()"></div>
        <div class="card w-full max-w-sm relative overflow-hidden shadow-2xl">
            <div class="p-6">
                <div class="flex justify-between items-start mb-6">
                    <h2 id="detail-title" class="text-xl font-bold pr-4">Übung</h2>
                    <button onclick="hideDetail()" class="text-gray-300 text-3xl">&times;</button>
                </div>
                <div class="rounded-2xl overflow-hidden bg-gray-50 aspect-square flex items-center justify-center">
                    <img id="detail-gif" src="" class="w-full h-full object-cover mix-blend-multiply">
                </div>
                <p class="text-gray-400 text-center text-sm mt-6">Achte auf eine kontrollierte Ausführung.</p>
            </div>
        </div>
    </div>

    <!-- History Detail -->
    <div id="history-modal" class="fixed inset-0 z-[120] hidden bg-white flex flex-col">
        <header class="p-6 flex justify-between items-center"><h2 id="history-detail-date" class="text-xl font-bold">Details</h2><button onclick="hideHistoryDetail()" class="text-gray-400 text-4xl">&times;</button></header>
        <div id="history-detail-content" class="flex-1 overflow-y-auto px-6 space-y-6 pb-20"></div>
    </div>

    <!-- Rest Timer -->
    <div id="rest-timer-overlay" class="fixed bottom-28 left-1/2 -translate-x-1/2 bg-white border border-gray-100 px-8 py-4 rounded-3xl shadow-2xl z-50 hidden flex items-center space-x-4">
        <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
        <span id="rest-time" class="text-2xl font-bold tabular-nums text-blue-500">60</span>
    </div>

    <script>
        const { createClient } = supabase;
        const supabaseUrl = 'https://zefzrvnqpqmypzskrskl.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplZnpydm5xcHFteXB6c2tyc2tsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MTkyMDcsImV4cCI6MjA5NTk5NTIwN30.k-4lVCN_vCHUS212fBZq1Wr4lhnDVth1mednj20_HXA';
        const db = createClient(supabaseUrl, supabaseKey);

        let currentUser = null, activeWorkout = null, workoutTimerInterval = null, restTimerInterval = null;
        let selectedMuscle = null, selectedEquip = null, pickerResults = [], searchTimeout = null;

        async function checkSession() {
            const { data: { session } } = await db.auth.getSession();
            handleAuthStateChange(session);
        }
        db.auth.onAuthStateChange((_, session) => handleAuthStateChange(session));

        function handleAuthStateChange(session) {
            if (session) {
                currentUser = session.user;
                document.getElementById('auth-screen').classList.add('hidden');
                updateUI();
                renderHistory();
            } else {
                currentUser = null;
                document.getElementById('auth-screen').classList.remove('hidden');
            }
        }

        async function handleSignIn() {
            const { error } = await db.auth.signInWithPassword({ 
                email: document.getElementById('auth-email').value, 
                password: document.getElementById('auth-password').value 
            });
            if (error) alert(error.message);
        }

        async function handleSignUp() {
            const { error } = await db.auth.signUp({ 
                email: document.getElementById('auth-email').value, 
                password: document.getElementById('auth-password').value 
            });
            if (error) alert(error.message); else alert('Check Mail!');
        }

        async function handleSignOut() { await db.auth.signOut(); window.location.reload(); }

        function updateUI() {
            document.getElementById('current-date').textContent = new Date().toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' }).toUpperCase();
            document.getElementById('profile-email').textContent = currentUser.email;
            document.getElementById('profile-initials').textContent = currentUser.email.charAt(0).toUpperCase();
        }

        function navigateTo(screen) {
            document.getElementById('home-screen').classList.toggle('hidden', screen !== 'home');
            document.getElementById('profile-screen').classList.toggle('hidden', screen !== 'profile');
            document.getElementById('nav-home-btn').classList.toggle('text-blue-500', screen === 'home');
            document.getElementById('nav-profile-btn').classList.toggle('text-blue-500', screen === 'profile');
        }

        function startNewWorkout() {
            activeWorkout = { startTime: new Date(), exercises: [] };
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('workout-screen').classList.remove('hidden');
            document.getElementById('main-header').classList.add('hidden');
            document.getElementById('bottom-nav').classList.add('hidden');
            startTimer();
        }

        function startTimer() {
            const el = document.getElementById('workout-timer');
            workoutTimerInterval = setInterval(() => {
                const diff = Math.floor((new Date() - activeWorkout.startTime) / 1000);
                el.textContent = `${Math.floor(diff/60).toString().padStart(2,'0')}:${(diff%60).toString().padStart(2,'0')}`;
            }, 1000);
        }

        const muscles = ["Brust", "Rücken", "Beine", "Schultern", "Arme", "Bauch", "Ganzkörper"];
        const equips = ["Langhantel", "Kurzhantel", "Maschine", "Kabelzug", "Eigengewicht", "Band", "Kettlebell"];

        function renderFilters() {
            document.getElementById('muscle-filters').innerHTML = muscles.map(m => `
                <div class="filter-chip ${selectedMuscle === m ? 'active' : ''}" onclick="toggleFilter('muscle', '${m}')">${m}</div>
            `).join('');
            document.getElementById('equip-filters').innerHTML = equips.map(e => `
                <div class="filter-chip ${selectedEquip === e ? 'active' : ''}" onclick="toggleFilter('equip', '${e}')">${e}</div>
            `).join('');
        }

        function toggleFilter(type, val) {
            if (type === 'muscle') selectedMuscle = selectedMuscle === val ? null : val;
            else selectedEquip = selectedEquip === val ? null : val;
            renderFilters();
            searchExercises(document.getElementById('exercise-search').value);
        }

        function showExercisePicker() { 
            renderFilters(); 
            document.getElementById('picker-modal').classList.remove('hidden');
            searchExercises(""); 
        }
        function hideExercisePicker() { document.getElementById('picker-modal').classList.add('hidden'); }

        async function searchExercises(query) {
            let q = db.from('exercises').select('*');
            if (query) q = q.ilike('name', `%${query}%`);
            if (selectedMuscle) q = q.eq('muscle', selectedMuscle);
            if (selectedEquip) q = q.eq('equipment', selectedEquip);
            const { data } = await q.order('name').limit(50);
            pickerResults = data || [];
            renderPickerResults();
        }

        function renderPickerResults() {
            const list = document.getElementById('picker-list');
            if (pickerResults.length === 0) { list.innerHTML = '<p class="text-center text-gray-400 mt-10">Keine Übung gefunden.</p>'; return; }
            list.innerHTML = pickerResults.map((ex, i) => `
                <div class="card p-4 flex items-center justify-between active:scale-[0.98] transition-transform" onclick="addExercise(${i})">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-xl bg-gray-50 overflow-hidden flex items-center justify-center">
                            <img src="${ex.gif_url}" class="w-full h-full object-cover mix-blend-multiply">
                        </div>
                        <div class="font-bold text-[14px]">${ex.name}</div>
                    </div>
                </div>
            `).join('');
        }

        function addExercise(idx) {
            activeWorkout.exercises.push({ ...pickerResults[idx], sets: [{ weight: '', reps: '', done: false }] });
            hideExercisePicker();
            renderActiveWorkout();
        }

        function renderActiveWorkout() {
            const container = document.getElementById('active-exercises');
            container.innerHTML = activeWorkout.exercises.map((ex, exIdx) => `
                <div class="card p-5 space-y-4">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center space-x-3" onclick="showDetail('${ex.gif_url}', '${ex.name}')">
                            <div class="w-10 h-10 rounded-lg bg-gray-50 overflow-hidden"><img src="${ex.gif_url}" class="w-full h-full object-cover mix-blend-multiply"></div>
                            <h3 class="font-bold text-blue-600 text-[15px]">${ex.name}</h3>
                        </div>
                        <button onclick="activeWorkout.exercises.splice(${exIdx},1); renderActiveWorkout();" class="text-gray-300">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2"></path></svg>
                        </button>
                    </div>
                    <table class="w-full text-center">
                        <tr class="text-[10px] text-gray-300 font-bold uppercase tracking-widest">
                            <td class="text-left">Satz</td><td>kg</td><td>Reps</td><td class="text-right">Ok</td>
                        </tr>
                        ${ex.sets.map((s, sIdx) => `
                            <tr class="${s.done ? 'opacity-30' : ''}">
                                <td class="text-left font-bold text-gray-400">${sIdx+1}</td>
                                <td><input type="number" value="${s.weight}" placeholder="0" oninput="activeWorkout.exercises[${exIdx}].sets[${sIdx}].weight=this.value" class="w-12 py-2 font-bold outline-none text-center"></td>
                                <td><input type="number" value="${s.reps}" placeholder="0" oninput="activeWorkout.exercises[${exIdx}].sets[${sIdx}].reps=this.value" class="w-12 py-2 font-bold outline-none text-center"></td>
                                <td class="text-right"><input type="checkbox" ${s.done ? 'checked' : ''} onchange="toggleSet(${exIdx}, ${sIdx})" class="custom-checkbox"></td>
                            </tr>
                        `).join('')}
                    </table>
                    <button onclick="addSet(${exIdx})" class="w-full py-3 bg-gray-50 rounded-xl text-[11px] font-bold text-gray-400">+ Satz</button>
                </div>
            `).join('');
        }

        function toggleSet(exIdx, sIdx) {
            activeWorkout.exercises[exIdx].sets[sIdx].done = !activeWorkout.exercises[exIdx].sets[sIdx].done;
            if (activeWorkout.exercises[exIdx].sets[sIdx].done) startRestTimer();
            renderActiveWorkout();
        }

        function startRestTimer() {
            clearInterval(restTimerInterval);
            const overlay = document.getElementById('rest-timer-overlay');
            overlay.classList.remove('hidden');
            let left = 60;
            document.getElementById('rest-time').textContent = left;
            restTimerInterval = setInterval(() => {
                left--; document.getElementById('rest-time').textContent = left;
                if (left <= 0) { clearInterval(restTimerInterval); overlay.classList.add('hidden'); }
            }, 1000);
        }

        function addSet(exIdx) {
            const last = activeWorkout.exercises[exIdx].sets.slice(-1)[0];
            activeWorkout.exercises[exIdx].sets.push({ weight: last.weight, reps: last.reps, done: false });
            renderActiveWorkout();
        }

        async function finishWorkout() {
            if (activeWorkout.exercises.length === 0) return location.reload();
            const { data } = await db.from('workouts').insert([{ user_id: currentUser.id, name: 'Training' }]).select();
            const sets = [];
            activeWorkout.exercises.forEach(ex => ex.sets.forEach((s, i) => {
                if (s.done) sets.push({ workout_id: data[0].id, exercise_id: ex.id, weight: parseFloat(s.weight)||0, reps: parseInt(s.reps)||0, set_order: i });
            }));
            if (sets.length > 0) await db.from('sets').insert(sets);
            location.reload();
        }

        async function renderHistory() {
            const { data } = await db.from('workouts').select('*, sets(*)').eq('user_id', currentUser.id).order('start_time', { ascending: false });
            const list = document.getElementById('history-list');
            if (!data || data.length === 0) { list.innerHTML = '<p class="text-center text-gray-400 py-10">Noch kein Training.</p>'; return; }
            
            let totalVol = 0; data.forEach(w => w.sets.forEach(s => totalVol += (parseFloat(s.weight) * parseInt(s.reps))));
            document.getElementById('stat-count').textContent = data.length;
            document.getElementById('stat-volume').innerHTML = `${Math.round(totalVol)} <span class="text-sm font-normal text-gray-400">kg</span>`;

            list.innerHTML = data.map((w, idx) => `
                <div class="card p-5 flex justify-between items-center" onclick="showHistoryDetail(${JSON.stringify(w).replace(/"/g, '&quot;')})">
                    <div><div class="font-bold text-[15px]">${new Date(w.start_time).toLocaleDateString('de-DE')} • Training</div><div class="text-[12px] text-gray-400">${w.sets.length} Sätze</div></div>
                    <svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-width="2"></path></svg>
                </div>
            `).join('');
        }

        async function showHistoryDetail(w) {
            document.getElementById('history-detail-date').textContent = new Date(w.start_time).toLocaleDateString('de-DE', {weekday:'long', day:'numeric', month:'long'});
            const { data: sets } = await db.from('sets').select('*, exercises(*)').eq('workout_id', w.id).order('created_at');
            const exInW = {};
            sets.forEach(s => {
                if (!exInW[s.exercise_id]) exInW[s.exercise_id] = { name: s.exercises.name, sets: [] };
                exInW[s.exercise_id].sets.push(s);
            });
            document.getElementById('history-detail-content').innerHTML = Object.values(exInW).map(ex => `
                <div class="space-y-2">
                    <h3 class="font-bold text-blue-600">${ex.name}</h3>
                    <div class="card p-4 space-y-2">
                        ${ex.sets.map((s, i) => `<div class="flex justify-between text-sm"><span class="text-gray-400 font-medium">Satz ${i+1}</span><span class="font-bold">${s.weight}kg × ${s.reps}</span></div>`).join('')}
                    </div>
                </div>
            `).join('');
            document.getElementById('history-modal').classList.remove('hidden');
        }

        function hideHistoryDetail() { document.getElementById('history-modal').classList.add('hidden'); }
        function showDetail(url, name) { document.getElementById('detail-title').textContent = name; document.getElementById('detail-gif').src = url; document.getElementById('detail-modal').classList.remove('hidden'); }
        function hideDetail() { document.getElementById('detail-modal').classList.add('hidden'); }

        document.getElementById('exercise-search').addEventListener('input', e => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => searchExercises(e.target.value), 300);
        });

        checkSession();
    </script>
