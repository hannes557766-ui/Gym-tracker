<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GNTK STUDIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #7000FF; --bg: #FFFFFF; --surface: #F8F8FA; --text: #000000; --muted: #88888E; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -0.02em; }
        h1 { font-weight: 900; letter-spacing: -0.05em; }
        .meta-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: saturate(180%) blur(20px); border-top: 0.5px solid rgba(0,0,0,0.05); }
        .action-sheet { transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); }
        .action-sheet.active { transform: translateY(0); }
        .btn-black { background: #000; color: #FFF; border-radius: 100px; font-weight: 700; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-black:active { transform: scale(0.96); }
        .btn-black:disabled { opacity: 0.3; }
        .exercise-card { border-bottom: 0.5px solid rgba(0,0,0,0.05); padding: 24px 0; }
        .check-pill { width: 48px; height: 48px; border-radius: 16px; background: var(--surface); display: flex; align-items: center; justify-content: center; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .check-pill.done { background: var(--accent); color: white; transform: scale(1.05); }
        .type-indicator { width: 26px; height: 26px; border-radius: 8px; display: flex; items-center; justify-content: center; font-size: 11px; font-weight: 900; cursor: pointer; }
        .type-N { background: var(--surface); color: var(--muted); }
        .type-W { background: #FFF9C4; color: #B71C1C; }
        .type-D { background: #E1F5FE; color: #0277BD; }
        .type-F { background: #FFEBEE; color: #C62828; }
        .plate { height: 40px; border-radius: 5px; display: inline-block; margin: 0 2px; font-size: 10px; font-weight: 900; line-height: 40px; color: white; text-align: center; }
        .plate-20 { width: 14px; background: #E63946; } .plate-15 { width: 12px; background: #F4A261; } .plate-10 { width: 10px; background: #2A9D8F; } .plate-5 { width: 8px; background: #457B9D; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-32 overflow-x-hidden">

    <div id="loader" class="fixed inset-0 z-[300] bg-white flex items-center justify-center transition-opacity duration-500">
        <h1 class="text-3xl italic animate-pulse">STUDIO.</h1>
    </div>

    <!-- Auth -->
    <div id="auth-screen" class="fixed inset-0 z-[200] bg-white hidden flex flex-col justify-between p-10 pb-20">
        <div class="mt-20"><h1 class="text-7xl mb-2">GNTK.</h1><p class="text-xl font-medium tracking-tight text-gray-400">Peak Performance Tracking.</p></div>
        <div class="space-y-4">
            <input type="email" id="auth-email" placeholder="E-Mail" class="w-full text-xl font-medium border-b-2 border-gray-100 py-4 outline-none focus:border-black transition-all">
            <input type="password" id="auth-password" placeholder="Passwort" class="w-full text-xl font-medium border-b-2 border-gray-100 py-4 outline-none focus:border-black transition-all">
            <div class="pt-10 space-y-4">
                <button onclick="handleSignIn()" id="login-btn" class="btn-black w-full py-5 text-lg">Anmelden</button>
                <button onclick="handleSignUp()" class="w-full py-2 font-bold text-sm text-gray-400">Account erstellen</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header id="main-header" class="px-8 pt-16 pb-8 flex justify-between items-start">
        <div><p class="meta-label mb-2" id="date-label">READY</p><h1 id="view-title" class="text-5xl">STUDIO.</h1></div>
        <div id="user-avatar" onclick="showTab('profile')" class="w-12 h-12 bg-gray-50 border border-gray-100 rounded-full flex items-center justify-center font-black text-sm text-indigo-600 shadow-sm cursor-pointer">?</div>
    </header>

    <main id="view-container" class="px-8">
        <!-- HOME -->
        <div id="view-home" class="space-y-12">
            <div class="bg-black p-8 rounded-[32px] text-white shadow-2xl relative overflow-hidden">
                <div class="relative z-10"><p class="meta-label text-white/40 mb-4">Intelligence</p><p id="daily-insight" class="text-2xl font-bold leading-tight">Syncing data...</p></div>
                <div class="absolute -top-10 -right-10 w-40 h-40 bg-purple-500/20 blur-[60px]"></div>
            </div>
            <section class="space-y-6">
                <div class="flex justify-between items-end"><h2 class="meta-label">Routinen</h2><button onclick="openEditor()" class="text-sm font-bold text-indigo-600">+ Neu</button></div>
                <div id="routines-list" class="grid grid-cols-1 gap-4"></div>
            </section>
            <section class="space-y-6 pb-10"><h2 class="meta-label">Letzte Sessions</h2><div id="history-list" class="space-y-1"></div></section>
        </div>

        <!-- STATS -->
        <div id="view-stats" class="hidden space-y-12">
            <div class="space-y-8"><p class="meta-label">Muskel Balance</p><div class="h-64 flex justify-center"><canvas id="muscleChart"></canvas></div></div>
            <div class="space-y-6">
                <div class="flex justify-between items-center"><p class="meta-label">Körpergewicht</p><button onclick="logWeight()" class="text-xs font-black text-indigo-600 uppercase tracking-widest">Eintragen</button></div>
                <div class="h-48"><canvas id="weightChart"></canvas></div>
            </div>
        </div>

        <!-- COACH -->
        <div id="view-coach" class="hidden flex flex-col h-[60vh]">
            <div id="chat-box" class="flex-1 space-y-6 overflow-y-auto no-scrollbar flex flex-col pb-6"></div>
            <div class="mt-4 flex bg-gray-50 p-2 rounded-[28px] border border-gray-100 shadow-inner">
                <input type="text" id="chat-input" placeholder="Frag mich was..." class="flex-1 px-6 py-4 bg-transparent outline-none font-medium">
                <button onclick="askCoach()" class="bg-black text-white px-6 rounded-[22px] shadow-lg"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
            </div>
        </div>

        <!-- PROFILE -->
        <div id="view-profile" class="hidden space-y-12">
            <div class="flex items-center space-x-6">
                <div class="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-[30px] flex items-center justify-center text-3xl font-black" id="p-initials">?</div>
                <div><input type="text" id="p-name-input" onchange="saveProfileSettings()" placeholder="Dein Name" class="text-3xl font-black w-full outline-none leading-none mb-1"><p class="text-gray-400 font-medium" id="p-email"></p></div>
            </div>
            <div class="bg-gray-50 p-6 rounded-[30px] space-y-4">
                <p class="meta-label">Gemini API Key</p>
                <input type="password" id="p-api-key" onchange="saveProfileSettings()" placeholder="AIzaSy..." class="w-full bg-white p-4 rounded-2xl text-xs font-mono shadow-sm outline-none border-none">
            </div>
            <div class="space-y-6"><p class="meta-label">Personal Records</p><div id="personal-bests" class="space-y-4"></div></div>
            <button onclick="handleSignOut()" class="w-full py-6 text-red-500 font-bold bg-red-50 rounded-[24px]">Session beenden</button>
        </div>
    </main>

    <!-- Workout Sheet -->
    <div id="workout-overlay" class="fixed inset-0 z-[150] bg-white hidden flex flex-col action-sheet">
        <header class="p-8 flex justify-between items-end border-b border-gray-50">
            <div><h2 id="wo-title" class="text-4xl font-black tracking-tight leading-none mb-1">Active</h2><p id="wo-timer" class="text-indigo-600 font-black tabular-nums">00:00</p></div>
            <button onclick="finishWorkout()" id="finish-btn" class="btn-black px-10 py-4 shadow-xl">FINISH</button>
        </header>
        <div id="wo-container" class="flex-1 overflow-y-auto px-8 space-y-12 py-10 no-scrollbar"></div>
        <div class="p-8 bg-white/80 backdrop-blur-md"><button onclick="showPicker(false)" class="w-full py-6 rounded-[28px] border-2 border-black/5 text-xs font-black uppercase tracking-[0.2em]">+ Übung hinzufügen</button></div>
    </div>

    <!-- Picker Sheet -->
    <div id="picker-modal" class="fixed inset-0 z-[200] hidden bg-white flex flex-col action-sheet shadow-2xl">
        <header class="p-8 flex justify-between items-center"><h2 class="text-3xl font-black italic">Search.</h2><button onclick="closePicker()" class="text-4xl">&times;</button></header>
        <div class="px-8 space-y-6">
            <input type="text" id="p-search" placeholder="Suche..." class="w-full text-3xl font-bold border-none outline-none caret-indigo-600">
            <div id="p-filters" class="flex space-x-3 overflow-x-auto no-scrollbar pb-4 border-b border-gray-50"></div>
        </div>
        <div id="p-list" class="flex-1 overflow-y-auto px-8 space-y-2 py-6 no-scrollbar"></div>
    </div>

    <!-- Details -->
    <div id="detail-modal" class="fixed inset-0 z-[250] hidden bg-white flex flex-col">
        <header class="p-8 flex justify-between items-center"><h2 id="d-title" class="text-2xl font-black">Detail.</h2><button onclick="closeDetail()" class="text-4xl">&times;</button></header>
        <div class="flex-1 overflow-y-auto px-8 space-y-12 pb-20 no-scrollbar">
            <div class="aspect-square rounded-[60px] overflow-hidden bg-gray-50 flex items-center justify-center shadow-inner"><img id="d-gif" src="" class="w-full h-full object-cover mix-blend-multiply"></div>
            <div class="space-y-6"><p class="meta-label text-center">Progression (est. 1RM)</p><div class="h-64"><canvas id="d-chart"></canvas></div></div>
        </div>
    </div>

    <!-- History -->
    <div id="history-modal" class="fixed inset-0 z-[190] hidden bg-white flex flex-col">
        <header class="p-8 flex justify-between items-center border-b border-gray-50"><h2 id="h-date" class="text-xl font-black uppercase tracking-tighter">Session</h2><div class="flex items-center space-x-6"><button id="h-delete" class="text-red-400 p-2"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2.5" stroke-linecap="round"></path></svg></button><button onclick="closeHistory()" class="text-4xl">&times;</button></div></header>
        <div id="h-content" class="flex-1 overflow-y-auto p-8 space-y-10 no-scrollbar"></div>
    </div>

    <!-- Plate Calc -->
    <div id="plate-modal" class="fixed inset-0 z-[260] hidden flex items-center justify-center p-6">
        <div class="absolute inset-0 bg-black/30 backdrop-blur-sm" onclick="this.parentElement.classList.add('hidden')"></div>
        <div class="bg-white rounded-[40px] w-full max-w-xs p-10 text-center space-y-8 shadow-2xl relative">
            <h3 id="plate-val" class="text-4xl font-black text-indigo-600">80 kg</h3>
            <div id="plate-graphic" class="flex items-center justify-center min-h-[50px] space-x-1"></div>
            <p class="text-[10px] text-gray-400 font-black uppercase tracking-widest leading-relaxed">Aufbau pro Seite<br>(inkl. 20kg Stange)</p>
        </div>
    </div>

    <!-- Nav Bar -->
    <nav id="navbar" class="fixed bottom-10 left-8 right-8 h-20 glass-nav rounded-[32px] flex justify-around items-center z-40 px-4 shadow-2xl">
        <button onclick="showTab('home')" id="nav-home" class="nav-item active flex-1"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg></button>
        <button onclick="showTab('stats')" id="nav-stats" class="nav-item flex-1"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg></button>
        <button onclick="showTab('coach')" id="nav-coach" class="nav-item flex-1"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg></button>
        <button onclick="showTab('profile')" id="nav-profile" class="nav-item flex-1"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg></button>
    </nav>

    <script>
        const { createClient } = supabase;
        const db = createClient('https://zefzrvnqpqmypzskrskl.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplZnpydm5xcHFteXB6c2tyc2tsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MTkyMDcsImV4cCI6MjA5NTk5NTIwN30.k-4lVCN_vCHUS212fBZq1Wr4lhnDVth1mednj20_HXA');
        
        let user = null, activeW = null, timerInt = null;
        let pRes = [], hData = [], rData = [], pBests = {}, sMuscle = null, userApiKey = null;
        let charts = { muscle: null, weight: null, detail: null };

        // --- AUTH ---
        async function checkAuth() {
            const { data } = await db.auth.getSession();
            if (data.session) { user = data.session.user; initApp(); }
            else { document.getElementById('auth-screen').classList.remove('hidden'); document.getElementById('loader').classList.add('opacity-0'); setTimeout(()=>document.getElementById('loader').classList.add('hidden'), 500); }
        }
        db.auth.onAuthStateChange((_, s) => { if (s) { user = s.user; initApp(); } else { window.location.reload(); } });

        async function initApp() {
            userApiKey = user.user_metadata?.gemini_key;
            document.getElementById('p-name-input').value = user.user_metadata?.full_name || "";
            document.getElementById('p-api-key').value = userApiKey || "";
            document.getElementById('p-email').textContent = user.email;
            document.getElementById('p-initials').textContent = (user.user_metadata?.full_name || user.email).charAt(0).toUpperCase();
            await loadData();
            document.getElementById('loader').classList.add('opacity-0'); setTimeout(()=>document.getElementById('loader').classList.add('hidden'), 500);
            getCoachInsight();
        }

        async function loadData() {
            const { data: h } = await db.from('workouts').select('*, sets(*, exercises(*))').eq('user_id', user.id).order('start_time', { ascending: false });
            hData = h || [];
            const { data: r } = await db.from('routines').select('*, routine_exercises(exercises(*))').eq('user_id', user.id);
            rData = r || [];
            refreshPRs(); renderHome();
        }

        function renderHome() {
            document.getElementById('routines-list').innerHTML = rData.map((r, i) => `
                <div class="bg-gray-50 p-8 rounded-[36px] flex justify-between items-center active:scale-95 transition-all" onclick="startWorkout(${i})">
                    <div><h3 class="text-xl font-black mb-1">${r.name}</h3><p class="meta-label">${r.routine_exercises.length} Übungen</p></div>
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
            `).join('');
            document.getElementById('history-list').innerHTML = hData.slice(0,8).map((w, i) => `
                <div class="exercise-card flex justify-between items-center active:opacity-50 transition" onclick="openHistory(${i})">
                    <div><p class="meta-label mb-1">${new Date(w.start_time).toLocaleDateString('de-DE')}</p><h3 class="text-lg font-bold">${w.name}</h3></div>
                    <p class="text-[10px] font-black text-gray-300">DETAILS</p>
                </div>
            `).join('');
        }

        // --- WORKOUT ---
        async function startWorkout(rI) {
            activeW = { startTime: new Date(), exercises: [], name: rI!==null?rData[rI].name:'Custom' };
            if (rI !== null) {
                for (let re of rData[rI].routine_exercises) {
                    const ex = re.exercises;
                    const lastW = hData.find(w => w.sets.some(s => s.exercise_id === ex.id));
                    let lp = lastW ? lastW.sets.filter(s => s.exercise_id === ex.id).map(s => `${s.weight}x${s.reps}`).join(' · ') : null;
                    activeW.exercises.push({ ...ex, lastP: lp, sets: [{ weight: lastW?.sets[0]?.weight || '', reps: lastW?.sets[0]?.reps || '', type: 'Normal', done: false }] });
                }
            }
            document.getElementById('wo-title').textContent = activeW.name;
            const ov = document.getElementById('workout-overlay'); ov.classList.remove('hidden'); setTimeout(()=>ov.classList.add('active'), 10);
            renderWorkoutUI(); startTimer();
        }

        function renderWorkoutUI() {
            document.getElementById('wo-container').innerHTML = activeW.exercises.map((ex, exI) => `
                <div class="space-y-6">
                    <div class="flex justify-between items-start">
                        <div class="flex items-center space-x-5" onclick="openDetail('${ex.id}', '${ex.gif_url}', '${ex.name}')">
                            <div class="w-16 h-16 rounded-[24px] bg-gray-50 flex items-center justify-center overflow-hidden shadow-sm"><img src="${ex.gif_url}" class="w-full h-full object-cover mix-blend-multiply"></div>
                            <div><h3 class="text-xl font-black leading-tight">${ex.name}</h3><p class="meta-label text-[8px]">${ex.muscle}</p></div>
                        </div>
                        <button onclick="activeW.exercises.splice(${exI},1); renderWorkoutUI();" class="text-gray-200 text-2xl">&times;</button>
                    </div>
                    <div class="space-y-3">
                        ${ex.sets.map((s, sI) => `
                            <div class="flex items-center space-x-4 ${s.done ? 'opacity-20' : ''} transition-all">
                                <div onclick="cycleType(${exI},${sI})" class="type-indicator type-${s.type.charAt(0)}">${s.type.charAt(0)}</div>
                                <input type="number" value="${s.weight}" placeholder="KG" oninput="activeW.exercises[${exI}].sets[${sI}].weight=this.value" onclick="showPlates(this.value)" class="flex-1 bg-gray-50 py-5 rounded-2xl font-black text-center text-lg">
                                <input type="number" value="${s.reps}" placeholder="REPS" oninput="activeW.exercises[${exI}].sets[${sI}].reps=this.value" class="flex-1 bg-gray-50 py-5 rounded-2xl font-black text-center text-lg">
                                <button onclick="toggleSet(${exI},${sI})" class="check-pill ${s.done ? 'done' : ''}"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-width="4"></path></svg></button>
                            </div>
                        `).join('')}
                    </div>
                    <button onclick="addSet(${exI})" class="meta-label text-indigo-600 font-black">+ Satz hinzufügen</button>
                </div>
            `).join('');
        }

        function toggleSet(exI, sI) {
            const s = activeW.exercises[exI].sets[sI]; s.done = !s.done;
            if (s.done) {
                if(navigator.vibrate) navigator.vibrate(15);
                const val = s.weight * (1 + s.reps/30);
                if (!pBests[activeW.exercises[exI].id] || val > pBests[activeW.exercises[exI].id].val) confetti({ particleCount: 60, spread: 50, origin: { y: 0.9 }, colors: ['#7000FF'] });
            }
            renderWorkoutUI();
        }

        async function finishWorkout() {
            if (activeW.exercises.length === 0) return window.location.reload();
            if (!confirm('Session speichern?')) return;
            document.getElementById('finish-btn').disabled = true;
            const { data } = await db.from('workouts').insert([{ user_id: user.id, name: activeW.name }]).select();
            const sets = [];
            activeW.exercises.forEach(ex => ex.sets.forEach((s, i) => { if (s.done) sets.push({ workout_id: data[0].id, exercise_id: ex.id, weight: parseFloat(s.weight)||0, reps: parseInt(s.reps)||0, set_type: s.type, set_order: i }); }));
            if (sets.length > 0) await db.from('sets').insert(sets);
            window.location.reload();
        }

        // --- PLATE CALC ---
        function showPlates(kg) {
            const t = parseFloat(kg); if (isNaN(t) || t < 20) return;
            let rem = (t - 20) / 2; const av = [20, 15, 10, 5, 2.5, 1.25]; let h = "";
            av.forEach(p => { while(rem >= p) { h += `<div class="plate plate-${Math.floor(p)}">${p}</div>`; rem -= p; } });
            document.getElementById('plate-val').textContent = kg + " kg";
            document.getElementById('plate-graphic').innerHTML = h || "<span class='text-gray-300 font-bold'>Nur Stange</span>";
            document.getElementById('plate-modal').classList.remove('hidden');
        }

        // --- NAVIGATION ---
        function showTab(t) {
            ['home','stats','coach','profile'].forEach(id => { document.getElementById('view-' + id).classList.add('hidden'); document.getElementById('nav-' + id).classList.remove('active'); });
            document.getElementById('view-' + t).classList.remove('hidden'); document.getElementById('nav-' + t).classList.add('active');
            document.getElementById('view-title').textContent = {home:'STUDIO.', stats:'ANALYTICS.', coach:'COACH.', profile:'STUDIO ID.'}[t];
            if(t === 'stats') renderStats();
        }

        // --- PICKER ---
        function showPicker(isRE) { 
            const m = document.getElementById('picker-modal'); m.classList.remove('hidden'); setTimeout(()=>m.classList.add('active'), 10);
            const mus = ["Brust", "Rücken", "Beine", "Schultern", "Arme", "Bauch", "Ganzkörper"];
            document.getElementById('p-filters').innerHTML = mus.map(m => `<button class="filter-chip ${sMuscle===m?'active':''}" onclick="sMuscle=sMuscle==='${m}'?null:'${m}'; renderFilters(); runSearch(document.getElementById('p-search').value)">${m}</button>`).join('');
            runSearch("");
        }
        function closePicker() { const m = document.getElementById('picker-modal'); m.classList.remove('active'); setTimeout(()=>m.classList.add('hidden'), 400); }
        async function runSearch(q) {
            let query = db.from('exercises').select('*'); if (q) query = query.ilike('name', `%${q}%`); if (sMuscle) query = query.eq('muscle', sMuscle);
            const { data } = await query.order('name').limit(20); pRes = data || [];
            document.getElementById('p-list').innerHTML = pRes.map((ex, i) => `<div class="exercise-card flex items-center space-x-6" onclick="selectEx(${i})"><div class="w-16 h-16 rounded-[20px] bg-gray-50 overflow-hidden flex-shrink-0"><img src="${ex.gif_url}" class="w-full h-full object-cover mix-blend-multiply"></div><div><h3 class="text-lg font-bold">${ex.name}</h3><p class="meta-label text-[8px]">${ex.muscle}</p></div></div>`).join('');
        }
        function selectEx(i) { activeW.exercises.push({ ...pRes[i], sets: [{ weight: '', reps: '', type: 'Normal', done: false }] }); renderWorkoutUI(); closePicker(); }

        // --- ANALYTICS ---
        function renderStats() {
            const counts = {}; hData.slice(0,10).forEach(w => w.sets.forEach(s => { const m = s.exercises?.muscle || 'Other'; counts[m] = (counts[m]||0) + 1; }));
            if (charts.muscle) charts.muscle.destroy();
            charts.muscle = new Chart(document.getElementById('muscleChart'), { type: 'doughnut', data: { labels: Object.keys(counts), datasets: [{ data: Object.values(counts), backgroundColor: ['#7000FF', '#000000', '#F4A261', '#E63946', '#2A9D8F'], borderWeight: 0 }] }, options: { cutout: '80%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 8, font: { size: 10, weight: 'bold' } } } } } });
        }

        // --- UTILS ---
        function cycleType(exI, sI) { const t = ['Normal', 'Warmup', 'Dropset', 'Failure']; const s = activeW.exercises[exI].sets[sI]; s.type = t[(t.indexOf(s.type)+1)%t.length]; renderWorkoutUI(); }
        function addSet(exI) { const last = activeW.exercises[exI].sets.slice(-1)[0]; activeW.exercises[exI].sets.push({ ...last, done: false }); renderWorkoutUI(); }
        function startTimer() { timerInt = setInterval(() => { const d = Math.floor((new Date()-activeW.startTime)/1000); document.getElementById('wo-timer').textContent = `${Math.floor(d/60).toString().padStart(2,'0')}:${(d%60).toString().padStart(2,'0')}`; }, 1000); }
        function refreshPRs() { pBests = {}; hData.forEach(w => w.sets.forEach(s => { const val = s.weight*(1+s.reps/30); if(!pBests[s.exercise_id] || val > pBests[s.exercise_id].val) pBests[s.exercise_id] = { val, weight: s.weight, reps: s.reps, name: s.exercises?.name }; })); document.getElementById('personal-bests').innerHTML = Object.values(pBests).sort((a,b) => b.val - a.val).slice(0,5).map(pr => `<div class="exercise-card flex justify-between items-center"><div><p class="meta-label mb-1">${pr.name}</p><h3 class="text-xl font-black">${pr.weight} KG</h3></div><p class="text-sm font-bold text-indigo-600">${pr.reps} REPS</p></div>`).join(''); }
        function openHistory(i) { const w = hData[i]; document.getElementById('h-date').textContent = new Date(w.start_time).toLocaleDateString('de-DE'); const g = {}; w.sets.forEach(s => { if(!g[s.exercise_id]) g[s.exercise_id] = { name: s.exercises?.name||'Übung', sets: [] }; g[s.exercise_id].sets.push(s); }); document.getElementById('h-content').innerHTML = Object.values(g).map(ex => `<div class="space-y-4"><h3 class="text-xl font-black">${ex.name}</h3><div class="space-y-2">${ex.sets.map((s, si) => `<div class="flex justify-between items-center border-b border-gray-50 pb-2"><span class="meta-label">Set ${si+1} (${s.set_type.charAt(0)})</span><span class="font-black text-lg">${s.weight}kg · ${s.reps}</span></div>`).join('')}</div></div>`).join(''); document.getElementById('h-delete').onclick = async () => { if(confirm('Löschen?')) { await db.from('workouts').delete().eq('id', w.id); window.location.reload(); } }; document.getElementById('history-modal').classList.remove('hidden'); }
        function closeHistory() { document.getElementById('history-modal').classList.add('hidden'); }
        async function openDetail(id, url, name) { document.getElementById('d-title').textContent = name; document.getElementById('d-gif').src = url; document.getElementById('detail-modal').classList.remove('hidden'); const { data: sets } = await db.from('sets').select('*, workouts(start_time)').eq('exercise_id', id).order('created_at'); const prog = {}; sets.forEach(s => { const d = new Date(s.workouts.start_time).toLocaleDateString('de-DE', {day:'2-digit',month:'2-digit'}); const val = s.weight * (1 + s.reps/30); if(!prog[d] || val > prog[d]) prog[d] = val; }); if(charts.detail) charts.detail.destroy(); charts.detail = new Chart(document.getElementById('d-chart').getContext('2d'), { type: 'line', data: { labels: Object.keys(prog), datasets: [{ data: Object.values(prog), borderColor: '#000', borderWidth: 4, pointRadius: 0, tension: 0.4 }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { display: false }, x: { grid: { display: false } } }, plugins: { legend: { display: false } } } }); }
        function closeDetail() { document.getElementById('detail-modal').classList.add('hidden'); }
        async function saveProfileSettings() { await db.auth.updateUser({ data: { full_name: document.getElementById('p-name-input').value, gemini_key: document.getElementById('p-api-key').value } }); }
        async function handleSignIn() { const { error } = await db.auth.signInWithPassword({ email: document.getElementById('auth-email').value, password: document.getElementById('auth-password').value }); if(error) alert(error.message); }
        async function handleSignUp() { const { error } = await db.auth.signUp({ email: document.getElementById('auth-email').value, password: document.getElementById('auth-password').value }); if(error) alert(error.message); else alert("Check Mail!"); }
        async function handleSignOut() { await db.auth.signOut(); }
        async function getCoachInsight() { if(!userApiKey) { document.getElementById('daily-insight').textContent = "Kein Key hinterlegt."; return; } const p = `Du bist GNTK Studio Coach. Antworte in EINEM kurzen Satz mit Fitness-Expertise basierend auf ${hData.length} Workouts.`; callGemini(p, r => document.getElementById('daily-insight').textContent = r); }
        async function askCoach() { const i = document.getElementById('chat-input'); const t = i.value.trim(); if (!t || !userApiKey) return; const b = document.getElementById('chat-box'); b.innerHTML += `<div class="chat-bubble chat-user">${t}</div>`; i.value = ""; const lId = "L"+Date.now(); b.innerHTML += `<div id="${lId}" class="chat-bubble chat-coach">...</div>`; b.scrollTop = b.scrollHeight; callGemini(t, r => { document.getElementById(lId).innerHTML = r.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>'); b.scrollTop = b.scrollHeight; }); }
        async function callGemini(t, cb) { try { const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${userApiKey}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ parts: [{ text: t }] }] }) }); const d = await r.json(); cb(d.candidates[0].content.parts[0].text); } catch (e) { cb("Key Error."); } }
        
        document.getElementById('p-search').oninput = (e) => runSearch(e.target.value);
        checkAuth();
    </script>
</body>
</html>
