<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GymLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg: #f5f4f1;
  --surface: #ffffff;
  --surface2: #faf9f7;
  --border: #e8e6e1;
  --border2: #d8d6d0;
  --text: #1a1917;
  --text2: #6b6964;
  --text3: #a09d98;
  --accent: #1a1917;
  --green: #1a7a4a;
  --green-bg: #eef7f2;
  --red: #c0392b;
  --red-bg: #fdf0ee;
  --amber: #9a5b00;
  --amber-bg: #fdf4e7;
  --blue: #1a4fa0;
  --blue-bg: #eef3fc;
  --r: 10px;
  --r-sm: 6px;
}

html{scroll-behavior:smooth}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Geist', -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-inner {
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--text);
}
.logo-dot { color: var(--text3); }

.header-right { display: flex; align-items: center; gap: 8px; }

/* ── Buttons ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'Geist', sans-serif;
  font-size: 13px;
  font-weight: 500;
  padding: 7px 14px;
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: all .15s;
  border: 1px solid var(--border2);
  background: var(--surface);
  color: var(--text2);
  white-space: nowrap;
}
.btn:hover { background: var(--bg); color: var(--text); border-color: var(--border2); }
.btn.primary {
  background: var(--text);
  color: white;
  border-color: var(--text);
}
.btn.primary:hover { background: #333; border-color: #333; }
.btn svg { width: 14px; height: 14px; flex-shrink: 0; }

/* ── Layout ── */
.main {
  max-width: 1120px;
  margin: 0 auto;
  padding: 32px 24px 80px;
}

/* ── Page Header ── */
.page-header {
  margin-bottom: 32px;
}
.page-title {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.03em;
  color: var(--text);
  margin-bottom: 4px;
}
.page-sub { color: var(--text3); font-size: 13px; }

/* ── Stats ── */
.stats-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  margin-bottom: 32px;
}
@media(max-width:900px){.stats-row{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.stats-row{grid-template-columns:repeat(2,1fr)}}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 18px 20px;
}
.stat-label {
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text3);
  margin-bottom: 8px;
}
.stat-value {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.04em;
  color: var(--text);
  line-height: 1;
}
.stat-value sup {
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0;
  color: var(--text2);
  margin-left: 2px;
  vertical-align: super;
}
.stat-hint {
  font-size: 11px;
  color: var(--text3);
  margin-top: 5px;
}

/* ── Two col ── */
.two-col {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 20px;
  align-items: start;
}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}

/* ── Section ── */
.section { margin-bottom: 24px; }
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.section-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text3);
}

/* ── Workout cards ── */
.workout-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); border-radius: var(--r); overflow: hidden; border: 1px solid var(--border); }

.workout-card {
  background: var(--surface);
  padding: 16px 18px;
  display: grid;
  grid-template-columns: 52px 1fr auto auto;
  align-items: center;
  gap: 16px;
  cursor: pointer;
  transition: background .12s;
}
.workout-card:hover { background: var(--surface2); }

.wc-date {
  text-align: center;
}
.wc-day {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--text);
}
.wc-month {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text3);
  margin-top: 2px;
}
.wc-info { min-width: 0; }
.wc-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 3px;
}
.wc-meta {
  font-size: 12px;
  color: var(--text3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.wc-meta span + span::before { content: ' · '; }

.badge {
  display: inline-flex;
  align-items: center;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 20px;
  letter-spacing: 0.02em;
  flex-shrink: 0;
}
.badge-push { background: var(--red-bg); color: var(--red); }
.badge-pull { background: var(--green-bg); color: var(--green); }
.badge-legs { background: var(--amber-bg); color: var(--amber); }
.badge-upper,.badge-lower,.badge-full { background: var(--blue-bg); color: var(--blue); }
.badge-cardio { background: #f0eef8; color: #6a4cb5; }
.badge-custom { background: var(--bg); color: var(--text2); }

.wc-delete {
  background: none;
  border: none;
  color: var(--text3);
  cursor: pointer;
  padding: 4px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  transition: color .12s, background .12s;
  flex-shrink: 0;
}
.wc-delete:hover { color: var(--red); background: var(--red-bg); }
.wc-delete svg { width: 14px; height: 14px; }

/* ── Sidebar panels ── */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
}
.panel-head {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text3);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.panel-body { padding: 16px 18px; }

/* ── PR Tabs ── */
.pr-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
}
.pr-tab {
  font-family: 'Geist', sans-serif;
  font-size: 11px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--border2);
  background: none;
  color: var(--text3);
  cursor: pointer;
  transition: all .15s;
}
.pr-tab:hover { color: var(--text); border-color: var(--border2); background: var(--bg); }
.pr-tab.active { background: var(--text); color: white; border-color: var(--text); }

/* ── Heatmap ── */
.heatmap-wrap { padding: 16px 18px; }
.heatmap-grid {
  display: grid;
  grid-template-rows: repeat(7, 10px);
  grid-auto-flow: column;
  gap: 3px;
}
.hm-cell {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  background: var(--bg);
  border: 1px solid var(--border);
  transition: transform .1s;
  cursor: default;
}
.hm-cell:hover { transform: scale(1.4); }
.hm-cell.l1 { background: #d1e8da; border-color: #b8d9c4; }
.hm-cell.l2 { background: #8ec9a8; border-color: #72b990; }
.hm-cell.l3 { background: #4aa876; border-color: #38956a; }
.hm-cell.l4 { background: var(--green); border-color: #155e3a; }

.heatmap-legend {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 10px;
  font-size: 10px;
  color: var(--text3);
}
.hl-cell { width: 10px; height: 10px; border-radius: 2px; }

/* ── Feeling dots ── */
.feeling {
  display: inline-flex;
  gap: 2px;
  align-items: center;
}
.feeling-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--border2);
}
.feeling-dot.on { background: var(--amber); }

/* ── Modal overlay ── */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(26,25,23,0.5);
  z-index: 200;
  align-items: flex-start;
  justify-content: center;
  padding: 60px 16px;
  overflow-y: auto;
}
.overlay.open { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  width: min(540px, 100%);
  animation: modalIn .2s ease;
  box-shadow: 0 4px 40px rgba(0,0,0,0.12);
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(-10px) scale(0.99); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-head {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-title {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.02em;
}
.modal-close {
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  color: var(--text3);
  border-radius: 4px;
  display: flex;
}
.modal-close:hover { color: var(--text); background: var(--bg); }
.modal-close svg { width: 18px; height: 18px; }

.modal-body { padding: 20px 24px; }
.modal-foot {
  padding: 16px 24px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* ── Form ── */
.form-row { display: grid; gap: 12px; margin-bottom: 14px; }
.form-row.cols2 { grid-template-columns: 1fr 1fr; }
.form-row.cols3 { grid-template-columns: 2fr 1fr 1fr; }

.form-group { display: flex; flex-direction: column; gap: 5px; }

label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text3);
}

input, select, textarea {
  font-family: 'Geist', sans-serif;
  font-size: 13px;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: var(--r-sm);
  padding: 8px 10px;
  outline: none;
  transition: border-color .15s, background .15s;
  width: 100%;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--text);
  background: white;
}
select option { background: white; }
textarea { resize: vertical; min-height: 72px; line-height: 1.5; }

/* ── Exercise rows ── */
.ex-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.ex-row {
  display: grid;
  grid-template-columns: 1fr 64px 64px 72px 28px;
  gap: 6px;
  align-items: end;
}
.ex-row .form-group { margin: 0; }
.remove-ex {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text3);
  padding: 8px 4px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  transition: color .12s;
  align-self: end;
}
.remove-ex:hover { color: var(--red); }
.remove-ex svg { width: 14px; height: 14px; }

.ex-header {
  display: grid;
  grid-template-columns: 1fr 64px 64px 72px 28px;
  gap: 6px;
  margin-bottom: 4px;
}
.ex-header span {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text3);
}

.add-ex-btn {
  width: 100%;
  background: none;
  border: 1px dashed var(--border2);
  border-radius: var(--r-sm);
  font-family: 'Geist', sans-serif;
  font-size: 12px;
  font-weight: 500;
  color: var(--text3);
  padding: 8px;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}
.add-ex-btn:hover { border-color: var(--text2); color: var(--text); background: var(--bg); }
.add-ex-btn svg { width: 13px; height: 13px; }

/* ── History modal ── */
.hist-search { margin-bottom: 14px; }
.hist-list { max-height: 40vh; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; background: var(--border); border-radius: var(--r-sm); border: 1px solid var(--border); }
.hist-list .workout-card { border-radius: 0; }

/* ── Backup row ── */
.backup-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
}
.btn-sm {
  font-size: 12px;
  padding: 6px 12px;
}
.btn-export { border-color: var(--green); color: var(--green); background: var(--green-bg); }
.btn-export:hover { background: #ddf0e8; }
.btn-import { border-color: var(--amber); color: var(--amber); background: var(--amber-bg); }
.btn-import:hover { background: #faedca; }

/* ── Empty state ── */
.empty {
  padding: 40px 20px;
  text-align: center;
  color: var(--text3);
  font-size: 13px;
}
.empty strong { display: block; font-weight: 500; color: var(--text2); margin-bottom: 4px; }

/* ── Chart ── */
#prCanvas { max-height: 160px; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ── Mono numbers ── */
.mono { font-family: 'Geist Mono', monospace; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">GymLog<span class="logo-dot">.</span></div>
    <div class="header-right">
      <button class="btn" id="historyBtn">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8a6 6 0 1 0 12 0A6 6 0 0 0 2 8zm6-3v3l2 2"/></svg>
        Verlauf
      </button>
      <button class="btn primary" id="newWorkoutBtn">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3v10M3 8h10"/></svg>
        Training
      </button>
    </div>
  </div>
</header>

<div class="main">

  <div class="page-header">
    <div class="page-title" id="pageTitle">Guten Morgen</div>
    <div class="page-sub" id="pageSub">Heutiges Datum wird geladen…</div>
  </div>

  <div class="stats-row" id="statsBar"></div>

  <div class="two-col">
    <div>
      <div class="section">
        <div class="section-header">
          <div class="section-title">Letzte Einheiten</div>
          <button class="btn btn-sm" id="historyBtn2" style="font-size:11px;padding:4px 10px;">Alle anzeigen</button>
        </div>
        <div class="workout-list" id="workoutLog"></div>
      </div>
    </div>

    <div>
      <div class="section">
        <div class="panel">
          <div class="panel-head">
            Bestleistung / PR
          </div>
          <div class="panel-body">
            <div class="pr-tabs" id="prTabs"></div>
            <canvas id="prCanvas" height="140"></canvas>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="panel">
          <div class="panel-head">Aktivität <span style="font-weight:400;font-size:11px;text-transform:none;letter-spacing:0;color:var(--text3)">90 Tage</span></div>
          <div class="heatmap-wrap">
            <div class="heatmap-grid" id="heatmap"></div>
            <div class="heatmap-legend">
              Weniger
              <div class="hl-cell" style="background:var(--bg);border:1px solid var(--border)"></div>
              <div class="hl-cell" style="background:#d1e8da"></div>
              <div class="hl-cell" style="background:#8ec9a8"></div>
              <div class="hl-cell" style="background:#4aa876"></div>
              <div class="hl-cell" style="background:var(--green)"></div>
              Mehr
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- ── Modal: Training ── -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">Neues Training</div>
      <button class="modal-close" id="cancelBtn">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l10 10M13 3L3 13"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-row cols2">
        <div class="form-group">
          <label>Datum</label>
          <input type="date" id="wDate" />
        </div>
        <div class="form-group">
          <label>Trainingstyp</label>
          <select id="wType">
            <option value="Push">Push — Brust / Schultern / Trizeps</option>
            <option value="Pull">Pull — Rücken / Bizeps</option>
            <option value="Legs">Legs — Beine</option>
            <option value="Upper">Upper Body</option>
            <option value="Lower">Lower Body</option>
            <option value="Full">Full Body</option>
            <option value="Cardio">Cardio</option>
            <option value="Custom">Frei / Custom</option>
          </select>
        </div>
      </div>
      <div class="form-row cols2">
        <div class="form-group">
          <label>Dauer (Min.)</label>
          <input type="number" id="wDuration" placeholder="60" min="5" max="300" />
        </div>
        <div class="form-group">
          <label>Gefühl</label>
          <select id="wFeeling">
            <option value="5">💪 5 — Beast Mode</option>
            <option value="4">😤 4 — Solide</option>
            <option value="3" selected>😐 3 — OK</option>
            <option value="2">😓 2 — Zäh</option>
            <option value="1">💀 1 — Schlecht</option>
          </select>
        </div>
      </div>

      <div style="margin-bottom:8px;">
        <div class="ex-header">
          <span>Übung</span><span>Sätze</span><span>Wdh.</span><span>Kg</span><span></span>
        </div>
        <div class="ex-list" id="exerciseList"></div>
        <button class="add-ex-btn" id="addExBtn">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3v10M3 8h10"/></svg>
          Übung hinzufügen
        </button>
      </div>

      <div class="form-group" style="margin-top:14px;">
        <label>Notizen</label>
        <textarea id="wNotes" placeholder="Wie lief es? PR gebrochen? Verletzungen?"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="cancelBtn2">Abbrechen</button>
      <button class="btn primary" id="saveBtn">Speichern</button>
    </div>
  </div>
</div>

<!-- ── Modal: Verlauf ── -->
<div class="overlay" id="historyOverlay">
  <div class="modal" style="width:min(620px,100%)">
    <div class="modal-head">
      <div class="modal-title">Trainingsverlauf</div>
      <button class="modal-close" id="closeHistoryBtn">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l10 10M13 3L3 13"/></svg>
      </button>
    </div>
    <div class="modal-body" style="padding-bottom:0">
      <div class="backup-row">
        <button class="btn btn-sm btn-export" id="exportBtn">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 10V3M5 7l3 3 3-3M3 12h10"/></svg>
          Backup exportieren
        </button>
        <button class="btn btn-sm btn-import" id="importBtn">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6v7M5 9l3-3 3 3M3 4h10"/></svg>
          Backup importieren
        </button>
        <input type="file" id="importFile" style="display:none" accept=".json" />
      </div>
      <div class="hist-search">
        <input type="text" id="historySearch" placeholder="Nach Übung, Typ oder Notiz filtern…" />
      </div>
      <div class="hist-list" id="historyLog"></div>
    </div>
    <div class="modal-foot" style="justify-content:flex-end;">
      <button class="btn" id="closeHistoryBtn2">Schließen</button>
    </div>
  </div>
</div>

<datalist id="exSuggestions">
  <option value="Bankdrücken"><option value="Schrägbankdrücken"><option value="Kurzhantel Bankdrücken">
  <option value="Schulterdrücken"><option value="Seitheben"><option value="Butterfly">
  <option value="Dips"><option value="Trizeps Pushdowns"><option value="Skull Crusher">
  <option value="Klimmzüge"><option value="Latzug"><option value="Kabelrudern">
  <option value="Rudern"><option value="Bizeps Curls"><option value="Hammer Curls">
  <option value="Kniebeugen"><option value="Beinpresse"><option value="Romanian Deadlift">
  <option value="Kreuzheben"><option value="Ausfallschritte"><option value="Beinbeuger">
  <option value="Beinstrecker"><option value="Wadenheben"><option value="Planks">
  <option value="Cable Crunch"><option value="Hyperextension"><option value="Hip Thrust">
</datalist>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const STORAGE_KEY = 'gymlog_v1';
let editingId = null;
let prChart = null;

function loadData(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[];}catch{return [];}}
function saveData(arr){localStorage.setItem(STORAGE_KEY,JSON.stringify(arr));}

const MONTHS = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const DAYS = ['So','Mo','Di','Mi','Do','Fr','Sa'];

function seed(){
  const d=(n)=>{const x=new Date();x.setDate(x.getDate()-n);return x.toISOString().split('T')[0];};
  return [
    {id:1,date:d(1),type:'Push',duration:65,feeling:4,notes:'Neue Bestleistung Bankdrücken!',exercises:[{name:'Bankdrücken',sets:'4',reps:'8',kg:'95'},{name:'Schulterdrücken',sets:'4',reps:'10',kg:'60'},{name:'Trizeps Pushdowns',sets:'3',reps:'12',kg:'35'}]},
    {id:2,date:d(3),type:'Pull',duration:55,feeling:5,notes:'Klimmzüge mit +10 kg PR!',exercises:[{name:'Klimmzüge',sets:'5',reps:'6',kg:'10'},{name:'Kabelrudern',sets:'4',reps:'10',kg:'70'},{name:'Bizeps Curls',sets:'3',reps:'12',kg:'25'}]},
    {id:3,date:d(5),type:'Legs',duration:70,feeling:3,notes:'Kniebeugen nach Pause.',exercises:[{name:'Kniebeugen',sets:'5',reps:'5',kg:'120'},{name:'Beinpresse',sets:'4',reps:'10',kg:'180'},{name:'Romanian Deadlift',sets:'3',reps:'10',kg:'80'}]},
    {id:4,date:d(7),type:'Push',duration:60,feeling:4,notes:'',exercises:[{name:'Bankdrücken',sets:'4',reps:'8',kg:'90'},{name:'Schulterdrücken',sets:'3',reps:'10',kg:'57.5'},{name:'Schrägbankdrücken',sets:'3',reps:'10',kg:'70'}]},
    {id:5,date:d(10),type:'Pull',duration:50,feeling:4,notes:'',exercises:[{name:'Klimmzüge',sets:'4',reps:'6',kg:'7.5'},{name:'Kabelrudern',sets:'4',reps:'10',kg:'67.5'},{name:'Bizeps Curls',sets:'3',reps:'12',kg:'22.5'}]},
    {id:6,date:d(14),type:'Legs',duration:75,feeling:5,notes:'Volumenrekord!',exercises:[{name:'Kniebeugen',sets:'5',reps:'6',kg:'115'},{name:'Beinpresse',sets:'4',reps:'12',kg:'170'},{name:'Hip Thrust',sets:'3',reps:'10',kg:'90'}]},
    {id:7,date:d(17),type:'Push',duration:55,feeling:3,notes:'',exercises:[{name:'Bankdrücken',sets:'4',reps:'8',kg:'87.5'},{name:'Dips',sets:'3',reps:'10',kg:'15'}]},
    {id:8,date:d(21),type:'Pull',duration:60,feeling:4,notes:'',exercises:[{name:'Latzug',sets:'4',reps:'10',kg:'80'},{name:'Kabelrudern',sets:'4',reps:'10',kg:'65'}]},
  ];
}

let workouts = loadData();
if(!workouts.length){workouts=seed();saveData(workouts);}

const $ = id => document.getElementById(id);

function fmtDate(s){
  const d=new Date(s+'T00:00:00');
  return {num:d.getDate(),mon:MONTHS[d.getMonth()],day:DAYS[d.getDay()]};
}

function totalVol(w){
  return w.exercises.reduce((s,e)=>s+(parseFloat(e.sets)||0)*(parseFloat(e.reps)||0)*(parseFloat(e.kg)||0),0);
}

function badgeClass(t){
  const m={Push:'badge-push',Pull:'badge-pull',Legs:'badge-legs',Upper:'badge-upper',Lower:'badge-lower',Full:'badge-full',Cardio:'badge-cardio',Custom:'badge-custom'};
  return m[t]||'badge-custom';
}

function deleteWorkout(id){
  if(!confirm('Training wirklich löschen?'))return;
  workouts=workouts.filter(w=>w.id!==id);
  saveData(workouts);
  renderAll();
  if($('historyOverlay').classList.contains('open'))renderHistoryLog();
}
window.editWorkout = id => openModal(id);
window.deleteWorkout = deleteWorkout;

function streak(){
  const today=new Date().toISOString().split('T')[0];
  const yest=new Date();yest.setDate(yest.getDate()-1);
  const y=yest.toISOString().split('T')[0];
  const sorted=[...new Set(workouts.map(w=>w.date))].sort().reverse();
  if(!sorted.length)return 0;
  if(sorted[0]!==today&&sorted[0]!==y)return 0;
  let count=0,cur=sorted[0];
  for(const d of sorted){
    if(d===cur){count++;const x=new Date(cur+'T00:00:00');x.setDate(x.getDate()-1);cur=x.toISOString().split('T')[0];}
    else if(d<cur)break;
  }
  return count;
}

function renderStats(){
  const now=new Date();
  const wk=workouts.filter(w=>(now-new Date(w.date+'T00:00:00'))/86400000<=7);
  const vol=workouts.reduce((s,w)=>s+totalVol(w),0);
  const avgD=workouts.length?Math.round(workouts.reduce((s,w)=>s+(w.duration||0),0)/workouts.length):0;
  const s=streak();

  $('statsBar').innerHTML=`
    <div class="stat-card">
      <div class="stat-label">Diese Woche</div>
      <div class="stat-value">${wk.length}</div>
      <div class="stat-hint">Einheiten</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Gesamt</div>
      <div class="stat-value">${workouts.length}</div>
      <div class="stat-hint">Trainings</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Streak</div>
      <div class="stat-value">${s}<sup>🔥</sup></div>
      <div class="stat-hint">Tage in Folge</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Ø Dauer</div>
      <div class="stat-value">${avgD}<sup>min</sup></div>
      <div class="stat-hint">Pro Einheit</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Volumen</div>
      <div class="stat-value">${(vol/1000).toFixed(1)}<sup>t</sup></div>
      <div class="stat-hint">Gesamt bewegt</div>
    </div>
  `;
}

function workoutCardHTML(w){
  const fd=fmtDate(w.date);
  const exNames=w.exercises.slice(0,3).map(e=>e.name).join(', ')+(w.exercises.length>3?'…':'');
  const vol=Math.round(totalVol(w));
  return `<div class="workout-card" onclick="editWorkout(${w.id})">
    <div class="wc-date"><div class="wc-day">${fd.num}</div><div class="wc-month">${fd.mon}</div></div>
    <div class="wc-info">
      <div class="wc-title">${w.type} Day</div>
      <div class="wc-meta"><span>${w.duration||'—'} min</span><span>${exNames||'Keine Übungen'}</span>${vol>0?`<span>${vol} kg Vol.</span>`:''}</div>
    </div>
    <div class="badge ${badgeClass(w.type)}">${w.type}</div>
    <button class="wc-delete" onclick="event.stopPropagation();deleteWorkout(${w.id})" title="Löschen">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l10 10M13 3L3 13"/></svg>
    </button>
  </div>`;
}

function renderLog(){
  const sorted=[...workouts].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
  $('workoutLog').innerHTML=sorted.length
    ?sorted.map(workoutCardHTML).join('')
    :'<div class="empty"><strong>Noch kein Training</strong>Leg gleich los 💪</div>';
}

function getExMap(){
  const m={};
  workouts.forEach(w=>w.exercises.forEach(e=>{
    const k=e.name.trim();if(!k)return;
    const kg=parseFloat(e.kg)||0;
    if(!m[k])m[k]=[];
    m[k].push({date:w.date,kg});
  }));
  return m;
}

function renderPRTabs(){
  const em=getExMap();
  const names=Object.keys(em);
  const tabs=$('prTabs');
  if(!names.length){tabs.innerHTML='<span style="color:var(--text3);font-size:12px">Noch keine Daten.</span>';return;}
  tabs.innerHTML=names.map((n,i)=>`<button class="pr-tab ${i===0?'active':''}" data-ex="${n}">${n}</button>`).join('');
  tabs.querySelectorAll('.pr-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      tabs.querySelectorAll('.pr-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      drawChart(btn.dataset.ex,em);
    });
  });
  drawChart(names[0],em);
}

function drawChart(name,em){
  const data=(em[name]||[]).sort((a,b)=>a.date.localeCompare(b.date));
  const labels=data.map(d=>{const f=fmtDate(d.date);return `${f.num} ${f.mon}`;});
  const vals=data.map(d=>d.kg);
  if(prChart)prChart.destroy();
  const ctx=$('prCanvas').getContext('2d');
  prChart=new Chart(ctx,{
    type:'line',
    data:{
      labels,
      datasets:[{
        data:vals,
        borderColor:'#1a7a4a',
        backgroundColor:'rgba(26,122,74,0.06)',
        borderWidth:2,
        pointBackgroundColor:'#1a7a4a',
        pointBorderColor:'white',
        pointBorderWidth:2,
        pointRadius:4,
        tension:0.3,
        fill:true,
      }]
    },
    options:{
      responsive:true,
      plugins:{legend:{display:false},tooltip:{
        backgroundColor:'#1a1917',
        borderColor:'rgba(255,255,255,0.1)',
        borderWidth:1,
        titleColor:'rgba(255,255,255,0.5)',
        titleFont:{size:11},
        bodyColor:'#ffffff',
        bodyFont:{size:13,weight:'500'},
        padding:10,
        callbacks:{label:c=>`${c.parsed.y} kg`}
      }},
      scales:{
        x:{ticks:{color:'#a09d98',font:{size:10}},grid:{color:'#f0ede8'},border:{display:false}},
        y:{ticks:{color:'#a09d98',font:{size:10},callback:v=>`${v} kg`},grid:{color:'#f0ede8'},border:{display:false}}
      }
    }
  });
}

function renderHeatmap(){
  const dm={};
  workouts.forEach(w=>{dm[w.date]=(dm[w.date]||0)+(totalVol(w)||1);});
  const today=new Date();
  const cells=[];
  for(let i=90;i>=0;i--){
    const d=new Date(today);d.setDate(d.getDate()-i);
    const k=d.toISOString().split('T')[0];
    const v=dm[k]||0;
    let l='';
    if(v>10000)l='l4';
    else if(v>5000)l='l3';
    else if(v>0)l='l2';
    else if(k in dm)l='l1';
    cells.push(`<div class="hm-cell ${l}" title="${k}${v?' · '+Math.round(v/100)/10+'t':''}"></div>`);
  }
  $('heatmap').innerHTML=cells.join('');
}

// Page greeting
function setGreeting(){
  const h=new Date().getHours();
  let g=h<12?'Guten Morgen':h<18?'Guten Tag':'Guten Abend';
  $('pageTitle').textContent=g;
  const now=new Date();
  $('pageSub').textContent=`${DAYS[now.getDay()]}, ${now.getDate()}. ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;
}

// Modal
function openModal(id=null){
  if(id){
    const w=workouts.find(x=>x.id===id);if(!w)return;
    editingId=id;
    $('modalTitle').textContent='Training bearbeiten';
    $('saveBtn').textContent='Änderungen speichern';
    $('wDate').value=w.date;
    $('wType').value=w.type;
    $('wDuration').value=w.duration||'';
    $('wFeeling').value=w.feeling||'3';
    $('wNotes').value=w.notes||'';
    $('exerciseList').innerHTML='';
    (w.exercises&&w.exercises.length?w.exercises:[{}]).forEach(addExRow);
  } else {
    editingId=null;
    $('modalTitle').textContent='Neues Training';
    $('saveBtn').textContent='Speichern';
    $('wDate').value=new Date().toISOString().split('T')[0];
    $('wType').value='Push';
    $('wDuration').value='';
    $('wFeeling').value='3';
    $('wNotes').value='';
    $('exerciseList').innerHTML='';
    addExRow();
  }
  $('overlay').classList.add('open');
}
function closeModal(){$('overlay').classList.remove('open');}

function addExRow(ex={}){
  const r=document.createElement('div');
  r.className='ex-row';
  r.innerHTML=`
    <div class="form-group" style="margin:0"><input type="text" class="ex-name" placeholder="Übungsname" value="${ex.name||''}" list="exSuggestions" /></div>
    <div class="form-group" style="margin:0"><input type="number" class="ex-sets" placeholder="4" min="1" max="20" value="${ex.sets||''}" /></div>
    <div class="form-group" style="margin:0"><input type="number" class="ex-reps" placeholder="10" min="1" max="100" value="${ex.reps||''}" /></div>
    <div class="form-group" style="margin:0"><input type="number" class="ex-kg" placeholder="80" step="0.5" value="${ex.kg||''}" /></div>
    <button class="remove-ex" title="Entfernen"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l10 10M13 3L3 13"/></svg></button>
  `;
  r.querySelector('.remove-ex').addEventListener('click',()=>r.remove());
  $('exerciseList').appendChild(r);
}

$('newWorkoutBtn').addEventListener('click',()=>openModal(null));
[$('cancelBtn'),$('cancelBtn2')].forEach(b=>b.addEventListener('click',closeModal));
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal();});
$('addExBtn').addEventListener('click',()=>addExRow());

$('saveBtn').addEventListener('click',()=>{
  const date=$('wDate').value;
  if(!date){alert('Bitte ein Datum angeben.');return;}
  const exercises=[...$('exerciseList').querySelectorAll('.ex-row')].map(r=>({
    name:r.querySelector('.ex-name').value.trim(),
    sets:r.querySelector('.ex-sets').value,
    reps:r.querySelector('.ex-reps').value,
    kg:r.querySelector('.ex-kg').value,
  })).filter(e=>e.name);
  const data={date,type:$('wType').value,duration:parseInt($('wDuration').value)||0,feeling:parseInt($('wFeeling').value)||3,notes:$('wNotes').value.trim(),exercises};
  if(editingId){
    const i=workouts.findIndex(x=>x.id===editingId);
    if(i!==-1)workouts[i]={...workouts[i],...data};
  } else {
    workouts.push({id:Date.now(),...data});
  }
  saveData(workouts);renderAll();
  if($('historyOverlay').classList.contains('open'))renderHistoryLog();
  closeModal();
});

// History modal
function openHistoryModal(){
  $('historySearch').value='';
  renderHistoryLog();
  $('historyOverlay').classList.add('open');
}
function closeHistoryModal(){$('historyOverlay').classList.remove('open');}

function renderHistoryLog(){
  const q=$('historySearch').value.toLowerCase().trim();
  let f=[...workouts].sort((a,b)=>b.date.localeCompare(a.date));
  if(q)f=f.filter(w=>w.type.toLowerCase().includes(q)||(w.notes&&w.notes.toLowerCase().includes(q))||w.exercises.some(e=>e.name.toLowerCase().includes(q)));
  $('historyLog').innerHTML=f.length
    ?f.map(workoutCardHTML).join('')
    :'<div class="empty"><strong>Keine Treffer</strong>Andere Suchbegriffe probieren</div>';
}

[$('historyBtn'),$('historyBtn2')].forEach(b=>b.addEventListener('click',openHistoryModal));
[$('closeHistoryBtn'),$('closeHistoryBtn2')].forEach(b=>b.addEventListener('click',closeHistoryModal));
$('historyOverlay').addEventListener('click',e=>{if(e.target===$('historyOverlay'))closeHistoryModal();});
$('historySearch').addEventListener('input',renderHistoryLog);

// Export/Import
$('exportBtn').addEventListener('click',()=>{
  if(!workouts.length){alert('Keine Daten zum Exportieren.');return;}
  const a=document.createElement('a');
  a.href='data:text/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(workouts,null,2));
  a.download=`gymlog_backup_${new Date().toISOString().split('T')[0]}.json`;
  document.body.appendChild(a);a.click();a.remove();
});
$('importBtn').addEventListener('click',()=>$('importFile').click());
$('importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=evt=>{
    try{
      const d=JSON.parse(evt.target.result);
      if(Array.isArray(d)&&confirm('Alle lokalen Daten überschreiben?')){
        workouts=d;saveData(workouts);renderAll();renderHistoryLog();alert('Backup geladen 💪');
      } else if(!Array.isArray(d)){alert('Ungültiges Dateiformat.');}
    } catch{alert('Fehler beim Lesen der Datei.');}
    e.target.value='';
  };
  r.readAsText(f);
});

function renderAll(){renderStats();renderLog();renderPRTabs();renderHeatmap();}

setGreeting();
renderAll();
</script>
</body>
</html>
