<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GNTK - Pro Gym</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --system-blue: #007AFF;
            --system-bg: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-main: #1C1C1E;
        }
        body { background-color: var(--system-bg); color: var(--text-main); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .card { background: var(--card-bg); border-radius: 20px; border: 1px solid rgba(0,0,0,0.05); }
        .btn-primary { background-color: var(--system-blue); color: white; transition: all 0.2s ease; }
        .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
        .custom-checkbox { width: 26px; height: 26px; border-radius: 8px; border: 2px solid #E5E5EA; appearance: none; cursor: pointer; position: relative; transition: all 0.2s; }
        .custom-checkbox:checked { background-color: #34C759; border-color: #34C759; }
        .custom-checkbox:checked::after { content: '✓'; color: white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: bold; }
        .input-field { background-color: #F2F2F7; border-radius: 12px; padding: 12px 16px; width: 100%; border: none; outline: none; font-weight: 500; }
        .nav-item { color: #8E8E93; transition: color 0.2s; }
        .nav-item.active { color: var(--system-blue); }
    </style>
</head>
<body class="pb-32">

    <!-- Auth Screen -->
    <div id="auth-screen" class="fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center px-10 space-y-8 hidden">
        <div class="text-center">
            <h1 class="text-4xl font-bold tracking-tighter">GNTK</h1>
            <p class="text-gray-400 font-medium mt-1">Minimalist Gym Tracking</p>
        </div>
        <div class="w-full max-w-sm space-y-4">
            <input type="email" id="auth-email" placeholder="E-Mail" class="input-field">
            <input type="password" id="auth-password" placeholder="Passwort" class="input-field">
            <div class="flex space-x-3">
                <button onclick="handleSignIn()" class="btn-primary flex-1 py-4 rounded-xl font-bold">Login</button>
                <button onclick="handleSignUp()" class="bg-gray-100 flex-1 py-4 rounded-xl font-bold text-gray-600">Registrieren</button>
            </div>
            <p id="auth-error" class="text-red-500 text-xs text-center hidden"></p>
        </div>
    </div>

    <!-- Header -->
    <header id="main-header" class="px-6 pt-12 pb-6">
        <p class="text-[12px] font-bold uppercase tracking-widest text-gray-400 mb-1" id="current-date"></p>
        <h1 id="header-title" class="text-3xl font-bold tracking-tight">Training</h1>
    </header>

    <!-- Main Screens -->
    <main id="app" class="px-6">
        
        <!-- HOME SCREEN -->
        <div id="home-screen" class="space-y-8">
            <button onclick="startNewWorkout()" class="btn-primary w-full py-5 rounded-2xl font-bold text-lg shadow-sm">Training starten</button>
            <section>
                <h2 class="text-[14px] font-bold text-gray-400 uppercase tracking-wider mb-4 ml-1">Zuletzt trainiert</h2>
                <div id="history-list" class="space-y-3"></div>
            </section>
        </div>

        <!-- PROFILE SCREEN -->
        <div id="profile-screen" class="hidden space-y-8">
            <div class="card p-6 flex items-center space-x-4">
                <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 text-2xl font-bold" id="profile-initials">?</div>
                <div>
                    <h2 class="text-xl font-bold" id="profile-name">Benutzer</h2>
                    <p class="text-gray-400 text-sm" id="profile-email"></p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="card p-5 text-center">
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Trainings</p>
                    <p class="text-2xl font-bold" id="stat-count">0</p>
                </div>
                <div class="card p-5 text-center">
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Volumen</p>
                    <p class="text-2xl font-bold" id="stat-volume">0 <span class="text-sm font-normal text-gray-400">kg</span></p>
                </div>
            </div>

            <section class="space-y-4">
                <h2 class="text-[14px] font-bold text-gray-400 uppercase tracking-wider ml-1">Einstellungen</h2>
                <div class="card p-2">
                    <div class="flex items-center justify-between p-4 border-b border-gray-50">
                        <span class="font-medium">Pausen-Timer (sek)</span>
                        <input type="number" id="setting-rest" value="60" onchange="saveSettings()" class="w-16 bg-transparent text-right font-bold text-blue-600 outline-none">
                    </div>
                    <div class="flex items-center justify-between p-4 border-b border-gray-50">
                        <span class="font-medium">Anzeigename</span>
                        <input type="text" id="setting-name" placeholder="Dein Name" onchange="saveSettings()" class="w-32 bg-transparent text-right font-bold text-blue-600 outline-none">
                    </div>
                    <button onclick="handleSignOut()" class="w-full p-4 text-left text-red-500 font-bold">Ausloggen</button>
                </div>
            </section>
        </div>

        <!-- WORKOUT SCREEN (Overlays everything) -->
        <div id="workout-screen" class="hidden space-y-6">
            <div class="flex justify-between items-end">
                <div>
                    <span id="workout-timer" class="text-2xl font-bold tabular-nums">00:00</span>
                    <p class="text-gray-400 text-sm font-medium">Aktive Session</p>
                </div>
                <button onclick="finishWorkout()" class="bg-gray-100 px-5 py-2.5 rounded-full font-bold text-sm">Beenden</button>
            </div>
            <div id="active-exercises" class="space-y-6"></div>
            <button onclick="showExercisePicker()" class="w-full py-4 rounded-2xl border-2 border-dashed border-gray-200 text-gray-400 font-semibold">+ Übung hinzufügen</button>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav" class="fixed bottom-8 left-6 right-6 h-16 bg-white/80 backdrop-blur-md rounded-2xl border border-white shadow-xl flex justify-around items-center px-4 z-40">
        <button onclick="navigateTo('home')" id="nav-home" class="nav-item active flex flex-col items-center p-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        </button>
        <button onclick="navigateTo('profile')" id="nav-profile" class="nav-item flex flex-col items-center p-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        </button>
    </nav>

    <!-- Rest Timer Overlay -->
    <div id="rest-timer-overlay" class="fixed bottom-28 left-1/2 -translate-x-1/2 bg-white border border-gray-100 px-6 py-3 rounded-2xl shadow-2xl z-50 hidden flex items-center space-x-3">
        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
        <span class="text-sm font-bold text-gray-500 uppercase tracking-widest">Pause</span>
        <span id="rest-time" class="text-xl font-bold tabular-nums text-blue-500">60</span>
    </div>

    <!-- Modals (Picker & Detail) -->
    <div id="picker-modal" class="fixed inset-0 z-[110] hidden bg-white flex flex-col">
        <header class="p-6 flex justify-between items-center"><h2 class="text-2xl font-bold">Übung wählen</h2><button onclick="hideExercisePicker()" class="p-2 bg-gray-100 rounded-full text-gray-400">&times;</button></header>
        <div class="px-6 mb-4"><input type="text" id="exercise-search" placeholder="Suche..." class="w-full bg-gray-100 rounded-xl px-5 py-3 outline-none"></div>
        <div id="picker-list" class="flex-1 overflow-y-auto px-6 space-y-3 pb-10"></div>
    </div>

    <div id="detail-modal" class="fixed inset-0 z-[120] hidden flex items-center justify-center p-6">
        <div class="absolute inset-0 bg-white/90 backdrop-blur-md" onclick="hideDetail()"></div>
        <div class="card w-full max-w-sm relative overflow-hidden p-6">
            <div class="flex justify-between items-start mb-6"><h2 id="detail-title" class="text-xl font-bold"></h2><button onclick="hideDetail()" class="p-2 bg-gray-100 rounded-full text-gray-400">&times;</button></div>
            <div class="rounded-2xl overflow-hidden bg-gray-50 mb-6 aspect-square"><img id="detail-gif" src="" class="w-full h-full object-cover mix-blend-multiply"></div>
            <p class="text-gray-500 text-sm text-center">Achte auf eine saubere Ausführung.</p>
        </div>
    </div>

    <script>
        const { createClient } = supabase;
        const supabaseUrl = 'https://zefzrvnqpqmypzskrskl.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplZnpydm5xcHFteXB6c2tyc2tsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MTkyMDcsImV4cCI6MjA5NTk5NTIwN30.k-4lVCN_vCHUS212fBZq1Wr4lhnDVth1mednj20_HXA';
        const db = createClient(supabaseUrl, supabaseKey);

        let currentUser = null;
        let activeWorkout = null;
        let workoutTimerInterval = null;
        let restTimerInterval = null;
        let searchTimeout = null;

        // Settings (Local fallback, then user metadata)
        let settings = { restDuration: 60, name: '' };

        async function checkSession() {
            const { data: { session } } = await db.auth.getSession();
            handleAuthStateChange(session);
        }

        db.auth.onAuthStateChange((_event, session) => handleAuthStateChange(session));

        function handleAuthStateChange(session) {
            const authScreen = document.getElementById('auth-screen');
            if (session) {
                currentUser = session.user;
                settings.name = currentUser.user_metadata.full_name || '';
                settings.restDuration = currentUser.user_metadata.rest_duration || 60;
                authScreen.classList.add('hidden');
                updateUI();
                renderHistory();
            } else {
                currentUser = null;
                authScreen.classList.remove('hidden');
            }
        }

        async function handleSignIn() {
            const { error } = await db.auth.signInWithPassword({ 
                email: document.getElementById('auth-email').value, 
                password: document.getElementById('auth-password').value 
            });
            if (error) { document.getElementById('auth-error').textContent = error.message; document.getElementById('auth-error').classList.remove('hidden'); }
        }

        async function handleSignUp() {
            const { error } = await db.auth.signUp({ 
                email: document.getElementById('auth-email').value, 
                password: document.getElementById('auth-password').value 
            });
            if (error) { document.getElementById('auth-error').textContent = error.message; document.getElementById('auth-error').classList.remove('hidden'); }
            else alert('Check your email or log in!');
        }

        async function handleSignOut() { await db.auth.signOut(); window.location.reload(); }

        async function saveSettings() {
            settings.restDuration = parseInt(document.getElementById('setting-rest').value);
            settings.name = document.getElementById('setting-name').value;
            await db.auth.updateUser({ data: { full_name: settings.name, rest_duration: settings.restDuration } });
            updateUI();
        }

        function updateUI() {
            const now = new Date();
            document.getElementById('current-date').textContent = now.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' }).toUpperCase();
            document.getElementById('profile-email').textContent = currentUser.email;
            document.getElementById('profile-name').textContent = settings.name || 'Benutzer';
            document.getElementById('setting-name').value = settings.name;
            document.getElementById('setting-rest').value = settings.restDuration;
            document.getElementById('profile-initials').textContent = (settings.name || currentUser.email).substring(0,1).toUpperCase();
        }

        function navigateTo(screen) {
            document.getElementById('home-screen').classList.toggle('hidden', screen !== 'home');
            document.getElementById('profile-screen').classList.toggle('hidden', screen !== 'profile');
            document.getElementById('nav-home').classList.toggle('active', screen === 'home');
            document.getElementById('nav-profile').classList.toggle('active', screen === 'profile');
            document.getElementById('header-title').textContent = screen === 'home' ? 'Training' : 'Profil';
        }

        function startNewWorkout() {
            activeWorkout = { startTime: new Date(), exercises: [] };
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('profile-screen').classList.add('hidden');
            document.getElementById('bottom-nav').classList.add('hidden');
            document.getElementById('workout-screen').classList.remove('hidden');
            document.getElementById('main-header').classList.add('hidden');
            startTimer();
        }

        function startTimer() {
            const el = document.getElementById('workout-timer');
            workoutTimerInterval = setInterval(() => {
                const diff = Math.floor((new Date() - activeWorkout.startTime) / 1000);
                el.textContent = `${Math.floor(diff/60).toString().padStart(2,'0')}:${(diff%60).toString().padStart(2,'0')}`;
            }, 1000);
        }

        function showExercisePicker() { document.getElementById('picker-modal').classList.remove('hidden'); }
        function hideExercisePicker() { document.getElementById('picker-modal').classList.add('hidden'); }

        async function searchExercises(query) {
            if (!query) return;
            const { data } = await db.from('exercises').select('*').ilike('name', `%${query}%`).limit(20);
            if (data) renderPickerResults(data);
        }

        function renderPickerResults(results) {
            const list = document.getElementById('picker-list');
            list.innerHTML = results.map(ex => `
                <div class="card p-4 flex items-center justify-between" onclick='addExercise(${JSON.stringify(ex).replace(/'/g, "&apos;")})'>
                    <div class="flex items-center space-x-4">
                        <img src="${ex.gif_url}" class="w-12 h-12 rounded-xl mix-blend-multiply">
                        <div class="font-bold text-[15px]">${ex.name}</div>
                    </div>
                </div>
            `).join('');
        }

        function addExercise(ex) {
            activeWorkout.exercises.push({ ...ex, sets: [{ weight: '', reps: '', done: false }] });
            hideExercisePicker();
            renderActiveWorkout();
        }

        function renderActiveWorkout() {
            const container = document.getElementById('active-exercises');
            container.innerHTML = activeWorkout.exercises.map((ex, exIdx) => `
                <div class="card p-5 space-y-4">
                    <h3 class="font-bold text-blue-600">${ex.name}</h3>
                    <table class="w-full text-center">
                        <tr class="text-[10px] text-gray-300 uppercase font-bold tracking-widest">
                            <td class="text-left">Set</td><td>kg</td><td>Reps</td><td class="text-right">Ok</td>
                        </tr>
                        ${ex.sets.map((s, sIdx) => `
                            <tr class="${s.done ? 'opacity-30' : ''}">
                                <td class="text-left font-bold text-gray-400">${sIdx+1}</td>
                                <td><input type="number" value="${s.weight}" oninput="activeWorkout.exercises[${exIdx}].sets[${sIdx}].weight=this.value" class="w-12 py-2 font-bold outline-none"></td>
                                <td><input type="number" value="${s.reps}" oninput="activeWorkout.exercises[${exIdx}].sets[${sIdx}].reps=this.value" class="w-12 py-2 font-bold outline-none"></td>
                                <td class="text-right"><input type="checkbox" ${s.done ? 'checked' : ''} onchange="toggleSet(${exIdx}, ${sIdx})" class="custom-checkbox"></td>
                            </tr>
                        `).join('')}
                    </table>
                    <button onclick="addSet(${exIdx})" class="w-full py-2 bg-gray-50 rounded-xl text-xs font-bold text-gray-400">+ Set</button>
                </div>
            `).join('');
        }

        function toggleSet(exIdx, sIdx) {
            const done = !activeWorkout.exercises[exIdx].sets[sIdx].done;
            activeWorkout.exercises[exIdx].sets[sIdx].done = done;
            if (done) startRestTimer();
            renderActiveWorkout();
        }

        function startRestTimer() {
            clearInterval(restTimerInterval);
            const overlay = document.getElementById('rest-timer-overlay');
            const timeEl = document.getElementById('rest-time');
            overlay.classList.remove('hidden');
            let left = settings.restDuration;
            timeEl.textContent = left;
            restTimerInterval = setInterval(() => {
                left--; timeEl.textContent = left;
                if (left <= 0) { clearInterval(restTimerInterval); overlay.classList.add('hidden'); }
            }, 1000);
        }

        function addSet(exIdx) {
            const last = activeWorkout.exercises[exIdx].sets.slice(-1)[0];
            activeWorkout.exercises[exIdx].sets.push({ weight: last.weight, reps: last.reps, done: false });
            renderActiveWorkout();
        }

        async function finishWorkout() {
            if (activeWorkout.exercises.length === 0) return location.reload();
            if (!confirm('Speichern?')) return;
            const { data } = await db.from('workouts').insert([{ user_id: currentUser.id, name: 'Workout' }]).select();
            const wId = data[0].id;
            const sets = [];
            activeWorkout.exercises.forEach(ex => ex.sets.forEach((s, i) => {
                if (s.done) sets.push({ workout_id: wId, exercise_id: ex.id, weight: s.weight||0, reps: s.reps||0, set_order: i });
            }));
            if (sets.length > 0) await db.from('sets').insert(sets);
            location.reload();
        }

        async function renderHistory() {
            const list = document.getElementById('history-list');
            const { data } = await db.from('workouts').select('*, sets(*)').eq('user_id', currentUser.id).order('start_time', { ascending: false });
            if (!data || data.length === 0) { list.innerHTML = '<p class="text-center text-gray-400">Keine Trainings.</p>'; return; }
            
            let totalVol = 0;
            data.forEach(w => w.sets.forEach(s => totalVol += (s.weight * s.reps)));
            document.getElementById('stat-count').textContent = data.length;
            document.getElementById('stat-volume').innerHTML = `${Math.round(totalVol)} <span class="text-sm font-normal text-gray-400">kg</span>`;

            list.innerHTML = data.map(w => `
                <div class="card p-5 flex justify-between items-center">
                    <div><div class="font-bold text-[15px]">${new Date(w.start_time).toLocaleDateString('de-DE', {day:'2-digit',month:'2-digit'})} • Workout</div><div class="text-[12px] text-gray-400">${w.sets.length} Sätze</div></div>
                </div>
            `).join('');
        }

        function showDetail(url, name) {
            document.getElementById('detail-title').textContent = name;
            document.getElementById('detail-gif').src = url;
            document.getElementById('detail-modal').classList.remove('hidden');
        }
        function hideDetail() { document.getElementById('detail-modal').classList.add('hidden'); }

        document.getElementById('exercise-search').addEventListener('input', e => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => searchExercises(e.target.value), 300);
        });

        checkSession();
    </script>

</html>
